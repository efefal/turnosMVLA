<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agenda — Panel MVLA</title>
  <link rel="icon" type="image/png" href="/assets/escudo_vla_web.png">
  <link rel="stylesheet" href="/assets/design-tokens.css">
  <style>
    /* ══════════════════════════════════════════════════════════════
       agenda.html — estilos locales
       Todos los colores, fuentes y espaciado vienen de design-tokens.css.
       No escribir valores hardcodeados en este archivo.
    ══════════════════════════════════════════════════════════════ */

    /* ── Layout shell ─────────────────────────────────────────── */
    .app-shell { display: flex; height: 100vh; overflow: hidden; }

    /* ── Sidebar ──────────────────────────────────────────────── */
    .sidebar {
      width: var(--sidebar-width);
      background: var(--bg-1);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
      overflow-y: auto;
    }
    .sidebar-header {
      display: flex;
      align-items: center;
      gap: var(--gap-sm);
      padding: 14px 12px 10px;
      border-bottom: 1px solid var(--border);
    }
    .sidebar-logo {
      width: 36px; height: 36px;
      border-radius: var(--radius-xl);
      background: var(--teal-dim);
      color: var(--teal);
      display: flex; align-items: center; justify-content: center;
      font-size: 11px; font-weight: 800;
      flex-shrink: 0;
      letter-spacing: 0.04em;
    }
    .sidebar-muni {
      font-size: 8.5px; font-weight: 700;
      text-transform: uppercase; letter-spacing: 0.05em;
      color: var(--text-3);
    }
    .sidebar-ciudad {
      font-size: 12.5px; font-weight: 700;
      color: var(--text-1);
    }
    .sidebar-user-card {
      margin: 8px;
      padding: 7px 9px;
      border-radius: var(--radius-md);
      display: flex;
      align-items: center;
      gap: var(--gap-sm);
    }
    .sidebar-avatar {
      width: 28px; height: 28px;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: var(--text-xs); font-weight: 700;
      flex-shrink: 0;
    }
    .nav-section-label {
      font-size: 8.5px; font-weight: 700;
      text-transform: uppercase; letter-spacing: 0.1em;
      color: var(--text-3);
      padding: 10px 12px 4px;
    }
    .sidebar-nav { padding: 0 6px; flex: 1; }
    .sidebar-footer {
      border-top: 1px solid var(--border);
      padding: 10px 12px;
    }
    .btn-logout-sidebar {
      background: transparent;
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      color: var(--text-2);
      padding: 5px 10px;
      font-family: var(--font-ui);
      font-size: var(--text-sm);
      cursor: pointer;
      width: 100%;
      transition: var(--transition-fast);
    }
    .btn-logout-sidebar:hover {
      background: var(--bg-4);
      border-color: var(--border-hi);
      color: var(--text-1);
    }

    /* ── Main area ────────────────────────────────────────────── */
    .main-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      background: var(--bg-2);
      overflow: hidden;
      min-width: 0;
    }

    /* ── Topbar ───────────────────────────────────────────────── */
    .topbar {
      height: var(--topbar-height);
      background: var(--bg-1);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: var(--gap-lg);
      padding: 0 16px;
      flex-shrink: 0;
    }
    .topbar-left {
      display: flex;
      align-items: center;
      gap: var(--gap-md);
      flex: 1;
      min-width: 0;
    }
    .topbar-center { flex-shrink: 0; }
    .topbar-right {
      display: flex;
      align-items: center;
      gap: var(--gap-md);
      flex-shrink: 0;
    }
    .topbar-title {
      font-size: var(--text-lg);
      font-weight: 700;
      color: var(--text-1);
      white-space: nowrap;
    }

    /* ── Toggle Día / Semana / Mes ────────────────────────────── */
    .btn-group-vista {
      display: inline-flex;
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      overflow: hidden;
      flex-shrink: 0;
    }
    .btn-vista {
      background: transparent;
      border: none;
      border-right: 1px solid var(--border);
      padding: 4px 10px;
      font-size: var(--text-sm);
      font-weight: 500;
      color: var(--text-2);
      cursor: pointer;
      font-family: var(--font-ui);
      transition: var(--transition-fast);
    }
    .btn-vista:last-child { border-right: none; }
    .btn-vista.activo { background: var(--teal-dim); color: var(--teal); font-weight: 600; }
    .btn-vista:hover:not(.activo) { background: var(--bg-4); color: var(--text-1); }

    /* ── Navegación de fecha ──────────────────────────────────── */
    .nav-fecha {
      display: flex;
      align-items: center;
      gap: var(--gap-xs);
      flex-shrink: 0;
    }
    .nav-fecha button {
      background: transparent;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 3px 8px;
      font-size: var(--text-sm);
      color: var(--text-2);
      cursor: pointer;
      font-family: var(--font-ui);
      transition: var(--transition-fast);
    }
    .nav-fecha button:hover { border-color: var(--border-hi); color: var(--text-1); }
    .nav-fecha input[type="date"] {
      background: var(--bg-3);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 3px 8px;
      font-size: var(--text-sm);
      color: var(--text-1);
      font-family: var(--font-ui);
      cursor: pointer;
    }
    .periodo-label {
      font-size: var(--text-sm);
      color: var(--text-2);
      font-weight: 500;
      white-space: nowrap;
    }

    /* ── Stats counters en topbar ─────────────────────────────── */
    /* topbar-counter, counter-* → design-tokens.css */
    #stats { display: flex; gap: var(--gap-xs); }

    /* ── Filterbar ────────────────────────────────────────────── */
    .filterbar {
      height: var(--filterbar-height);
      background: var(--bg-2);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      gap: var(--gap-md);
      flex-shrink: 0;
    }
    .filterbar-left {
      display: flex;
      align-items: center;
      gap: var(--gap-sm);
    }
    .filterbar-right {
      display: flex;
      align-items: center;
      gap: var(--gap-sm);
    }
    .filterbar-label {
      font-size: var(--text-sm);
      font-weight: 600;
      color: var(--text-3);
    }
    #selector-areas-agenda {
      display: flex;
      align-items: center;
      gap: var(--gap-xs);
    }
    #filtro-operador select {
      background: var(--bg-3);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      color: var(--text-1);
      padding: 4px 8px;
      font-size: var(--text-sm);
      font-family: var(--font-ui);
      cursor: pointer;
    }
    #filtro-operador select:focus { outline: none; border-color: var(--border-hi); }

    /* ── Calendar area ────────────────────────────────────────── */
    .calendar-area {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
    }
    .fecha-label-bar {
      font-size: var(--text-sm);
      font-weight: 600;
      color: var(--text-2);
      padding: 8px 16px 4px;
    }

    /* ── Alertas ──────────────────────────────────────────────── */
    .alerta { padding: 8px 16px; font-size: var(--text-base); display: none; }
    .alerta.visible { display: block; }
    .alerta-error {
      background: var(--red-dim);
      border-bottom: 1px solid var(--red-mid);
      color: var(--red);
    }
    .alerta-ok {
      background: var(--teal-dim);
      border-bottom: 1px solid var(--teal-mid);
      color: var(--teal);
    }

    /* ── Cargando y vacío ─────────────────────────────────────── */
    .cargando {
      text-align: center; color: var(--text-3);
      padding: 3rem; font-style: italic; font-size: var(--text-base);
    }
    .vacio { text-align: center; color: var(--text-3); padding: 3rem; }
    .vacio p { margin-top: 0.5rem; font-size: var(--text-sm); }

    /* ── Grilla calendario — week/day layout ──────────────────── */
    .cal-week-wrapper { display: flex; flex: 1; }
    .cal-time-col {
      width: var(--hora-col-width);
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
    }
    .cal-time-header { height: 52px; flex-shrink: 0; }
    .cal-time-slot {
      height: var(--slot-height);
      display: flex;
      align-items: flex-start;
      justify-content: flex-end;
      padding: 2px 6px 0 0;
      font-family: var(--font-mono);
      font-size: var(--text-xs);
      color: var(--text-3);
      flex-shrink: 0;
      border-top: 1px solid var(--hora-line-full);
    }
    .cal-time-slot.half { border-top-color: var(--hora-line-half); }
    .cal-days-area {
      flex: 1;
      display: flex;
      overflow-x: auto;
      border-left: 1px solid var(--border);
    }

    /* ── Columna de día ───────────────────────────────────────── */
    .cal-day-col {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      border-right: 1px solid var(--border);
    }
    .cal-day-col:last-child { border-right: none; }
    .cal-day-header {
      height: 52px;
      flex-shrink: 0;
      padding: 6px 8px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2px;
      border-bottom: 1px solid var(--border);
      transition: background 0.15s;
    }
    .cal-day-col[data-state="today"]   .cal-day-header { background: var(--day-hdr-today); }
    .cal-day-col[data-state="blocked"] .cal-day-header { background: var(--day-hdr-blocked); }
    .cal-day-col[data-state="holiday"] .cal-day-header { background: var(--day-hdr-holiday); }
    .cal-day-col[data-state="closed"]  .cal-day-header { background: var(--day-hdr-closed); }

    .cal-day-name {
      font-size: var(--text-xs); font-weight: 700;
      text-transform: uppercase; color: var(--text-3);
    }
    .cal-day-col[data-state="today"]   .cal-day-name { color: var(--teal); }
    .cal-day-col[data-state="blocked"] .cal-day-name { color: var(--blue); }
    .cal-day-col[data-state="holiday"] .cal-day-name { color: var(--red); }
    .cal-day-col[data-state="closed"]  .cal-day-name { color: var(--text-3); }

    .cal-day-num {
      font-family: var(--font-mono); font-size: var(--text-2xl);
      font-weight: 800; line-height: 1; color: var(--text-2);
    }
    .cal-day-col[data-state="today"]   .cal-day-num { color: var(--teal); }
    .cal-day-col[data-state="blocked"] .cal-day-num { color: var(--blue); }
    .cal-day-col[data-state="holiday"] .cal-day-num { color: var(--red); }
    .cal-day-col[data-state="closed"]  .cal-day-num { color: var(--text-3); }

    .cal-day-badge-blocked {
      font-size: var(--text-xs); font-weight: 700;
      text-transform: uppercase; letter-spacing: 0.06em;
      color: var(--blue); background: var(--blue-dim);
      border: 1px solid var(--blue-mid);
      border-radius: var(--radius-sm); padding: 1px 4px;
    }
    .cal-day-block-info { font-size: 8px; color: var(--text-3); text-align: center; }
    .cal-day-count { font-size: 8px; color: var(--text-3); }

    /* ── Cuerpo del día — contenedor de cards absolutas ──────── */
    .cal-day-body {
      position: relative;
      flex: 1;
      min-height: calc(20 * var(--slot-height)); /* 08:00–17:30 = 20 slots */
    }
    .cal-day-col[data-state="today"]   .cal-day-body { background: var(--day-bg-today); }
    .cal-day-col[data-state="blocked"] .cal-day-body { background: var(--day-bg-blocked); }
    .cal-day-col[data-state="holiday"] .cal-day-body { background: var(--day-bg-holiday); }
    .cal-day-col[data-state="closed"]  .cal-day-body { background: var(--day-bg-closed); }

    /* ── Líneas horizontales de hora ─────────────────────────── */
    .hora-line {
      position: absolute; left: 0; right: 0; height: 1px; pointer-events: none;
    }
    .hora-line-full { background: var(--hora-line-full); }
    .hora-line-half { background: var(--hora-line-half); }

    /* ── Cards de turno — layout interno ─────────────────────── */
    /* .turno-card, .turno-blue/teal/red → design-tokens.css     */
    .turno-card-inner { display: flex; flex-direction: column; height: 100%; }
    .turno-row-1 {
      display: flex; align-items: center;
      justify-content: space-between; gap: var(--gap-xs);
    }
    .turno-hora { font-family: var(--font-mono); font-size: 9.5px; }
    .turno-avatar {
      width: 17px; height: 17px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 7px; font-weight: 700; flex-shrink: 0;
    }
    .turno-nombre {
      font-size: var(--text-sm); font-weight: 700; color: var(--text-1);
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .turno-blue .turno-avatar { background: var(--blue-mid); color: var(--blue); }
    .turno-teal .turno-avatar { background: var(--teal-mid); color: var(--teal); }
    .turno-red  .turno-avatar { background: var(--red-mid);  color: var(--red); }
    .turno-blue .turno-hora   { color: var(--blue); }
    .turno-teal .turno-hora   { color: var(--teal); }
    .turno-red  .turno-hora   { color: var(--red); }

    /* ── Acciones dentro de la card (vista día) ──────────────── */
    .turno-acciones { display: flex; gap: var(--gap-xs); flex-wrap: wrap; margin-top: var(--gap-xs); }

    /* ── Mini-calendario del sidebar ─────────────────────────── */
    .minical { padding: 10px 10px 6px; border-bottom: 1px solid var(--border); }
    .minical-header {
      display: flex; align-items: center; justify-content: center;
      font-size: var(--text-xs); font-weight: 600;
      color: var(--text-2); margin-bottom: 6px;
      text-transform: uppercase; letter-spacing: 0.06em;
    }
    .minical-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; }
    .minical-dow {
      text-align: center; font-size: 8.5px; font-weight: 700;
      text-transform: uppercase; color: var(--text-3); padding: 2px 0;
    }
    .minical-cell {
      text-align: center; font-family: var(--font-mono);
      font-size: 10px; padding: 2px 1px;
      border-radius: var(--radius-sm); color: var(--text-2); line-height: 1.6;
    }
    .minical-cell.en-semana { background: var(--teal-dim); color: var(--teal); font-weight: 700; }
    .minical-cell.hoy       { background: var(--teal); color: var(--bg-0); font-weight: 700; }
    .minical-cell.otro-mes  { color: var(--text-3); opacity: 0.5; }

    /* ── Vista mes ────────────────────────────────────────────── */
    .vista-mes { padding: 12px 16px; flex: 1; }
    .cal-header-dias {
      display: grid; grid-template-columns: repeat(7, 1fr);
      gap: 3px; margin-bottom: 4px;
    }
    .cal-nombre-dia {
      text-align: center; font-size: var(--text-xs); font-weight: 700;
      color: var(--text-3); padding: 4px 0;
      text-transform: uppercase; letter-spacing: 0.04em;
    }
    .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 3px; }
    .cal-dia {
      border: 1px solid var(--border); border-radius: var(--radius-md);
      padding: 6px 8px; min-height: 64px; cursor: pointer;
      transition: var(--transition-fast);
      display: flex; flex-direction: column; gap: 4px;
      background: var(--bg-3);
    }
    .cal-dia:hover { background: var(--bg-4); border-color: var(--border-hi); }
    .cal-dia.otro-mes { opacity: 0.3; pointer-events: none; }
    .cal-dia.cal-hoy  { border-color: var(--teal); background: var(--teal-dim); }
    .cal-num {
      font-family: var(--font-mono); font-size: var(--text-base);
      font-weight: 600; color: var(--text-2);
    }
    .cal-hoy .cal-num { color: var(--teal); }
    .cal-dia.cal-feriado     { background: var(--day-bg-holiday); border-color: var(--red-mid); }
    .cal-dia.cal-bloqueado   { background: var(--day-bg-blocked); border-color: var(--blue-mid); }
    .cal-dia.cal-bloqueado-ind { background: var(--blue-dim); border-color: var(--blue-mid); }
    .cal-dia.cal-feriado     .cal-num { color: var(--red); }
    .cal-dia.cal-bloqueado   .cal-num { color: var(--blue); }
    .cal-dia.cal-bloqueado-ind .cal-num { color: var(--blue); }
    .cal-count {
      background: var(--teal); color: var(--bg-0);
      border-radius: 99px; font-size: 9px; font-weight: 700;
      padding: 1px 6px; align-self: flex-start;
    }
    .cal-indicador { font-size: var(--text-xs); font-weight: 600; line-height: 1; }
    .cal-indicador.feriado       { color: var(--red); }
    .cal-indicador.bloqueado     { color: var(--blue); }
    .cal-indicador.bloqueado-ind { color: var(--blue); }

    /* ── Modal cancelar ───────────────────────────────────────── */
    .modal-fondo {
      display: none; position: fixed; inset: 0;
      background: var(--drawer-overlay); z-index: 200;
      align-items: center; justify-content: center; padding: 1rem;
    }
    .modal-fondo.abierto { display: flex; }
    .modal-caja {
      background: var(--bg-3); border: 1px solid var(--border);
      border-radius: var(--radius-lg); padding: 24px;
      max-width: 460px; width: 100%;
      box-shadow: 0 20px 60px rgba(0,0,0,.5);
    }
    .modal-caja h3 {
      font-size: var(--text-xl); font-weight: 800;
      color: var(--text-1); margin-bottom: 6px;
    }
    .modal-info { color: var(--text-2); font-size: var(--text-sm); margin-bottom: 16px; }
    .modal-caja label {
      display: block; font-size: var(--text-sm); font-weight: 600;
      color: var(--text-2); margin-bottom: 6px;
    }
    .modal-caja textarea {
      width: 100%; background: var(--bg-4); border: 1px solid var(--border);
      border-radius: var(--radius-md); color: var(--text-1);
      padding: 8px 10px; font-size: var(--text-base);
      font-family: var(--font-ui); resize: vertical;
    }
    .modal-caja textarea:focus { border-color: var(--border-hi); outline: none; }
    .modal-footer { display: flex; gap: 10px; justify-content: flex-end; margin-top: 16px; }

    /* ── Estilos transicionales ─────────────────────────────────
       Se eliminan a medida que se reescriben las funciones de render
       en los pasos 5-9 del plan.                                  */

    /* Botones usados en el HTML estático y en renderizarAcciones() */
    .btn-ghost   { background: transparent; color: var(--text-2); border: 1px solid var(--border); }
    .btn-ghost:hover { background: var(--bg-4); border-color: var(--border-hi); color: var(--text-1); }
    .btn-success { background: var(--teal);  color: var(--bg-0); border: 1px solid var(--teal); }
    .btn-success:hover { background: #26bf8e; }
    .btn-warning { background: var(--amber); color: var(--bg-0); border: 1px solid var(--amber); }
    .btn-warning:hover { opacity: 0.85; }
    .btn-logout  { background: transparent; border: 1px solid var(--border); color: var(--text-2);
                   padding: 4px 10px; border-radius: var(--radius-md); cursor: pointer;
                   font-size: var(--text-sm); font-family: var(--font-ui); }

    /* Badge de sin tomar */
    .badge-sin-tomar {
      font-size: var(--text-xs); font-weight: 600; color: var(--text-3);
      background: var(--bg-4); border: 1px solid var(--border);
      border-radius: 20px; padding: 2px 8px; display: inline-block;
    }

    /* Badges de estado — reemplazados por turno-card en pasos 7-8 */
    .badge { display: inline-block; padding: 2px 8px; border-radius: 20px;
             font-size: var(--text-xs); font-weight: 600; }
    .badge-agendado { background: var(--blue-dim);  color: var(--blue); }
    .badge-presente { background: var(--teal-dim);  color: var(--teal); }
    .badge-ausente  { background: var(--red-dim);   color: var(--red); }
    .badge-atendido { background: var(--bg-4);      color: var(--text-3); }

    /* Tabla DÍA y SEMANA — reemplazadas por grilla de cards en pasos 7-8 */
    .tabla-wrapper { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; }
    th {
      background: var(--bg-3); color: var(--text-3); font-weight: 600;
      font-size: var(--text-xs); text-transform: uppercase; letter-spacing: 0.04em;
      padding: 8px 12px; border-bottom: 1px solid var(--border); text-align: left;
    }
    td { padding: 10px 12px; border-bottom: 1px solid var(--border); vertical-align: middle; }
    tr:last-child td { border-bottom: none; }
    tr:hover td { background: var(--bg-4); }
    .nombre-vecino { font-weight: 500; color: var(--text-1); }
    .dni-vecino    { font-size: var(--text-xs); color: var(--text-2); margin-top: 2px; }
    .td-acciones   { display: flex; gap: 4px; flex-wrap: wrap; }
    .tabla-semana-wrapper { overflow-x: auto; }
    .tabla-semana { width: 100%; border-collapse: collapse; table-layout: fixed; min-width: 640px; }
    .tabla-semana th {
      background: var(--bg-3); color: var(--text-2); font-weight: 600;
      font-size: var(--text-xs); padding: 6px 4px;
      border-bottom: 1px solid var(--border); text-align: center;
    }
    .tabla-semana .col-hora { width: 52px; }
    .tabla-semana td {
      border: 1px solid var(--border); vertical-align: top;

<script>
// ─── Constantes ────────────────────────────────────────────────────────────
const ESTADOS = {
  agendado: 'Agendado', presente: 'Presente', ausente: 'Ausente',
  atendido: 'Atendido', cancelado: 'Cancelado', reprogramado: 'Reprogramado',
};
const DIAS_CORTO  = ['Lun', 'Mar', 'Mié', 'Jue', 'Vie', 'Sáb', 'Dom'];
const MESES_LARGO = ['Enero','Febrero','Marzo','Abril','Mayo','Junio',
                     'Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];

// ─── Estado global ─────────────────────────────────────────────────────────
let fechaActual    = new Date().toISOString().substring(0, 10);
let vista          = 'dia';    // 'dia' | 'semana' | 'mes'
let turnosActuales = [];
let turnoACancelar = null;
let usuarioRol     = '';       // se fija en init(); usado por renderizarAcciones
let todasLasAreas  = [];       // B9: áreas accesibles, llenadas en init()

// ─── B9: Chips de área ─────────────────────────────────────────────────────
// Construye los chips de área en el selector y recarga la agenda al cambiar.
function inicializarChipsAgenda() {
  const selector  = document.getElementById('selector-areas-agenda');
  const container = document.getElementById('chips-areas-agenda');
  if (todasLasAreas.length <= 1) return;

  selector.classList.add('visible');

  const chipTodas = document.createElement('span');
  chipTodas.className   = 'area-chip activo';
  chipTodas.textContent = 'Todas';
  chipTodas.dataset.id  = 'todas';
  chipTodas.onclick = () => {
    container.querySelectorAll('.area-chip').forEach(c => c.classList.remove('activo'));
    chipTodas.classList.add('activo');
    cargar();
  };
  container.appendChild(chipTodas);

  todasLasAreas.forEach(a => {
    const chip = document.createElement('span');
    chip.className   = 'area-chip';
    chip.textContent = a.nombre;
    chip.dataset.id  = String(a.id);
    chip.onclick = () => {
      chipTodas.classList.remove('activo');
      chip.classList.toggle('activo');
      const hayActivos = container.querySelectorAll('.area-chip.activo:not([data-id="todas"])').length > 0;
      if (!hayActivos) chipTodas.classList.add('activo');
      cargar();
    };
    container.appendChild(chip);
  });
}

// Devuelve los parámetros de área como string "&areas[]=N&areas[]=M" o "" si "Todas".
function areasParam() {
  const container = document.getElementById('chips-areas-agenda');
  if (!container || container.children.length === 0) return '';
  const chipTodas = container.querySelector('[data-id="todas"]');
  if (chipTodas?.classList.contains('activo')) return '';
  const activos = [...container.querySelectorAll('.area-chip.activo:not([data-id="todas"])')];
  if (!activos.length) return '';
  return activos.map(c => `&areas[]=${c.dataset.id}`).join('');
}

// Genera el HTML del badge de rol con el color institucional según el rol.
// Se llama desde init() y se usa en todas las pantallas.
function rolBadgeHTML(rol) {
  const cfg = {
    operador:  { bg: '#1e40af', label: 'Operador' },
    encargado: { bg: '#166534', label: 'Encargado' },
    sistemas:  { bg: '#6b21a8', label: 'Sistemas' },
    directivo: { bg: '#374151', label: 'Solo lectura' },
  };
  const { bg, label } = cfg[rol] || { bg: '#374151', label: rol };
  return `<span class="badge-rol" style="background:${bg};color:white">${label}</span>`;
}

// Días especiales para las tres vistas (día, semana, mes).
// Se precarga junto con los turnos para que el renderizado los tenga disponibles.
//
//   feriados:           Set  → días que son feriado nacional o local.
//   bloqueados:         Set  → días con bloqueo de oficina de día completo (sin atención).
//   bloqueosIndividuales: Object → { "YYYY-MM-DD": ["Nombre Op 1", "Nombre Op 2"] }
//                         Días en los que uno o más operadores tienen bloqueo individual.
let diasEspeciales = {
  feriados:            new Set(),
  bloqueados:          new Set(),
  bloqueosIndividuales: {},
};

// ─── Auth ──────────────────────────────────────────────────────────────────
function getToken() {
  const t = sessionStorage.getItem('panel_token');
  if (!t) { window.location.href = '/panel/login.html'; return null; }
  return t;
}
function getUsuario() { return JSON.parse(sessionStorage.getItem('panel_usuario') || '{}'); }

async function apiFetch(url, opts = {}) {
  const token = getToken();
  if (!token) return null;
  const res = await fetch(url, {
    ...opts,
    headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${token}`, ...opts.headers },
  });
  if (res.status === 401) {
    sessionStorage.clear();
    window.location.href = '/panel/login.html';
    return null;
  }
  return res;
}

async function cerrarSesion() {
  try { await apiFetch('/panel/logout', { method: 'POST' }); } catch {}
  sessionStorage.clear();
  window.location.href = '/panel/login.html';
}

// ─── Helpers ───────────────────────────────────────────────────────────────
function esc(s) {
  return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function mostrarAlerta(tipo, msg) {
  const errEl = document.getElementById('alerta-error');
  const okEl  = document.getElementById('alerta-ok');
  errEl.classList.remove('visible'); okEl.classList.remove('visible');
  if (!msg) return;
  if (tipo === 'error') { errEl.textContent = msg; errEl.classList.add('visible'); }
  else                  { okEl.textContent  = msg; okEl.classList.add('visible'); }
  if (tipo === 'ok') setTimeout(() => okEl.classList.remove('visible'), 4000);
}

// Convierte "YYYY-MM-DD" a Date local sin desfase de zona horaria
function parseFecha(str) {
  const [y, m, d] = str.split('-').map(Number);
  return new Date(y, m - 1, d);
}

// Formatea "YYYY-MM-DD" → "DD/MM"
function formatoCorto(str) {
  const [, m, d] = str.split('-');
  return `${d}/${m}`;
}

// Devuelve la fecha del lunes de la semana que contiene `fechaStr`
function lunesDeLaSemana(fechaStr) {
  const d   = parseFecha(fechaStr);
  const dia = d.getDay(); // 0=Dom, 1=Lun...
  const diff = dia === 0 ? -6 : 1 - dia;
  d.setDate(d.getDate() + diff);
  return d.toISOString().substring(0, 10);
}

// Genera los 7 días (Lun–Dom) de la semana que empieza en `lunesStr`
function diasDeLaSemana(lunesStr) {
  const dias = [];
  const d = parseFecha(lunesStr);
  for (let i = 0; i < 7; i++) {
    dias.push(d.toISOString().substring(0, 10));
    d.setDate(d.getDate() + 1);
  }
  return dias;
}

// Genera slots de tiempo cada 30 min entre hora ini y hora fin (formato "HH:MM")
function generarSlotsTiempo(desde = '08:00', hasta = '17:30') {
  const slots = [];
  let [h, m] = desde.split(':').map(Number);
  const [hf, mf] = hasta.split(':').map(Number);
  while (h < hf || (h === hf && m <= mf)) {
    slots.push(`${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}`);
    m += 30;
    if (m >= 60) { h++; m -= 60; }
  }
  return slots;
}

const HOY = new Date().toISOString().substring(0, 10);

// ─── Navegación — Vista DÍA ────────────────────────────────────────────────
function moverFecha(dias) {
  const d = parseFecha(fechaActual);
  d.setDate(d.getDate() + dias);
  fechaActual = d.toISOString().substring(0, 10);
  document.getElementById('fecha-input').value = fechaActual;
  cargarDia();
}
function onFechaChange() {
  fechaActual = document.getElementById('fecha-input').value;
  cargarDia();
}
function irAHoy() {
  fechaActual = HOY;
  document.getElementById('fecha-input').value = fechaActual;
  cargarDia();
}

// ─── Navegación — Vista SEMANA ─────────────────────────────────────────────
function moverSemana(semanas) {
  const lunes = parseFecha(lunesDeLaSemana(fechaActual));
  lunes.setDate(lunes.getDate() + semanas * 7);
  fechaActual = lunes.toISOString().substring(0, 10);
  cargarSemana();
}
function irASemanaActual() {
  fechaActual = HOY;
  cargarSemana();
}

// ─── Navegación — Vista MES ────────────────────────────────────────────────
function moverMes(meses) {
  const d = parseFecha(fechaActual + '-01'.replace(/(.*)-\d+$/, '$1-01').slice(-3));
  // Tomamos año/mes de fechaActual y le sumamos `meses`
  const [y, m] = fechaActual.split('-').map(Number);
  const fecha  = new Date(y, m - 1 + meses, 1);
  fechaActual  = fecha.toISOString().substring(0, 10).substring(0, 8) + '01';
  cargarMes();
}
function irAMesActual() {
  fechaActual = HOY;
  cargarMes();
}

// ─── Cambiar vista ─────────────────────────────────────────────────────────
function cambiarVista(nuevaVista) {
  vista = nuevaVista;

  // Actualizar botones del selector
  ['dia','semana','mes'].forEach(v => {
    document.getElementById(`btn-vista-${v}`).classList.toggle('activo', v === vista);
  });

  // Mostrar/ocultar navigaciones
  document.getElementById('nav-dia').style.display    = vista === 'dia'    ? 'flex' : 'none';
  document.getElementById('nav-semana').style.display = vista === 'semana' ? 'flex' : 'none';
  document.getElementById('nav-mes').style.display    = vista === 'mes'    ? 'flex' : 'none';

  cargar();
}

function cargar() {
  if (vista === 'dia')    cargarDia();
  else if (vista === 'semana') cargarSemana();
  else cargarMes();
}

// ─── Helpers de label ──────────────────────────────────────────────────────
function actualizarLabelDia() {
  const label = parseFecha(fechaActual).toLocaleDateString('es-AR', {
    weekday: 'long', day: 'numeric', month: 'long', year: 'numeric',
  });
  document.getElementById('fecha-label').textContent =
    label.charAt(0).toUpperCase() + label.slice(1);
}

function actualizarLabelSemana(lunes, domingo) {
  document.getElementById('label-semana').textContent =
    `${formatoCorto(lunes)} al ${formatoCorto(domingo)}`;
  document.getElementById('fecha-label').textContent =
    `Semana del ${formatoCorto(lunes)} al ${formatoCorto(domingo)}`;
}

function actualizarLabelMes(año, mes) {
  const label = `${MESES_LARGO[mes - 1]} ${año}`;
  document.getElementById('label-mes').textContent    = label;
  document.getElementById('fecha-label').textContent  = label;
}

// ─── Stats ─────────────────────────────────────────────────────────────────
function renderizarStats(turnos) {
  const contar = (e) => turnos.filter(t => t.estado === e).length;
  const chips = [
    { cls: 'chip-total',    label: 'Total',     val: turnos.length },
    { cls: 'chip-agendado', label: 'Agendados', val: contar('agendado') },
    { cls: 'chip-presente', label: 'Presentes', val: contar('presente') },
    { cls: 'chip-atendido', label: 'Atendidos', val: contar('atendido') },
    { cls: 'chip-ausente',  label: 'Ausentes',  val: contar('ausente')  },
  ];
  document.getElementById('stats').innerHTML = chips
    .map(c => `<div class="stat-chip ${c.cls}"><strong>${c.val}</strong> ${c.label}</div>`)
    .join('');
}

// ─── Vista DÍA ─────────────────────────────────────────────────────────────
function renderizarAcciones(t) {
  // El directivo solo puede ver, no actuar
  if (usuarioRol === 'directivo') {
    return '<span style="color:#94a3b8;font-size:.8rem">—</span>';
  }

  // Turno sin tomar (agendado, operador_id = null) → Tomar + Cancelar
  if (!t.operador_id && t.estado === 'agendado') {
    return `<div class="td-acciones">
      <button class="btn btn-primary" onclick="tomarTurno(${t.id})">Tomar</button>
      <button class="btn btn-danger"  onclick="abrirCancelar(${t.id})">Cancelar</button>
    </div>`;
  }

  // Turno tomado (agendado, operador asignado) → Presente + Ausente + Liberar
  if (t.operador_id && t.estado === 'agendado') {
    return `<div class="td-acciones">
      <button class="btn btn-success" onclick="cambiarEstado(${t.id},'presente')">Presente</button>
      <button class="btn btn-warning" onclick="cambiarEstado(${t.id},'ausente')">Ausente</button>
      <button class="btn btn-ghost"   onclick="liberarTurno(${t.id})">Liberar</button>
    </div>`;
  }

  // Estados finales o intermedios sin acciones disponibles
  return '<span style="color:#94a3b8;font-size:.8rem">—</span>';
}

function renderizarTablaDia(turnos) {
  if (!turnos.length) {
    document.getElementById('tabla-container').innerHTML =
      `<div class="vacio">📅<p>No hay turnos para este día.</p></div>`;
    return;
  }
  const filas = turnos.map(t => `
    <tr>
      <td style="font-weight:600;white-space:nowrap">${esc(t.hora_inicio.substring(0,5))}</td>
      <td>
        <div class="nombre-vecino">${esc(t.vecino_nombre)}</div>
        <div class="dni-vecino">DNI ${esc(t.vecino_dni)}</div>
      </td>
      <td>${esc(t.servicio_nombre)}</td>
      <td>${t.operador_nombre ? esc(t.operador_nombre) : '<span class="badge-sin-tomar">Sin tomar</span>'}</td>
      <td><span class="badge badge-${t.estado}">${ESTADOS[t.estado] || t.estado}</span></td>
      <td>${renderizarAcciones(t)}</td>
    </tr>
  `).join('');

  document.getElementById('tabla-container').innerHTML = `
    <table>
      <thead>
        <tr>
          <th>Hora</th>
          <th>Vecino</th>
          <th>Trámite</th>
          <th>Operador</th>
          <th>Estado</th>
          <th>Acciones</th>
        </tr>
      </thead>
      <tbody>${filas}</tbody>
    </table>
  `;
}

// ─── Banners informativos de la vista DÍA ─────────────────────────────────
// Inyecta al inicio del tabla-container los banners que correspondan según el
// tipo de día (feriado, bloqueo de oficina, bloqueos individuales de operadores).
// Se llama después de renderizarTablaDia() para que los banners queden arriba.
function renderizarBannersDia() {
  const container = document.getElementById('tabla-container');
  const banners   = [];

  // Banner de feriado — prioridad máxima (rojo)
  if (diasEspeciales.feriados.has(fechaActual)) {
    banners.push(`<div class="banner-dia banner-feriado">📅 Este día es feriado — no hay atención programada.</div>`);
  }

  // Banner de bloqueo de oficina (ámbar)
  if (diasEspeciales.bloqueados.has(fechaActual)) {
    banners.push(`<div class="banner-dia banner-bloqueado">🔒 Este día tiene un bloqueo de oficina — sin atención.</div>`);
  }

  // Banner de bloqueos individuales de operadores (azul)
  const nombresInd = diasEspeciales.bloqueosIndividuales[fechaActual] || [];
  if (nombresInd.length > 0) {
    const lista  = nombresInd.map(n => esc(n)).join(', ');
    const verbo  = nombresInd.length === 1 ? 'tiene' : 'tienen';
    banners.push(`<div class="banner-dia banner-bloqueado-ind">👤 ${lista} ${verbo} bloqueo este día.</div>`);
  }

  // Insertar banners al inicio del container (antes de la tabla o del mensaje de vacío)
  if (banners.length > 0) {
    container.insertAdjacentHTML('afterbegin', banners.join(''));
  }
}

async function cargarDia() {
  actualizarLabelDia();
  mostrarAlerta(null);
  document.getElementById('tabla-container').innerHTML = '<div class="cargando">Cargando...</div>';

// ─── Feriados y bloqueos ───────────────────────────────────────────────────
// Precarga los días especiales del rango desde el servidor y los guarda en
// `diasEspeciales`. Se llama en paralelo con la carga de turnos (Promise.all)
// para no agregar latencia perceptible al usuario.
//
// Incluye automáticamente el operadorId del dropdown cuando hay uno seleccionado,
// para que el endpoint filtre los bloqueos individuales según corresponda.
//
// Si falla (error de red, token vencido, etc.) la agenda sigue cargando
// normalmente pero sin los indicadores de color — falla silenciosa.
async function cargarDiasEspeciales(desde, hasta) {
  // Pasar el operadorId al endpoint para que filtre bloqueos individuales según
  // el encargado haya seleccionado un operador específico o "todos".
  const operadorId = document.getElementById('select-operador')?.value || '';
  let url = `/panel/feriados-bloqueos?desde=${desde}&hasta=${hasta}`;
  if (operadorId) url += `&operadorId=${operadorId}`;

  try {
    const res = await apiFetch(url);
    if (!res || !res.ok) return;
    const data = await res.json();
    diasEspeciales = {
      feriados:            new Set(data.feriados  || []),
      bloqueados:          new Set(data.bloqueados || []),
      bloqueosIndividuales: data.bloqueosIndividuales || {},
    };
  } catch {
    diasEspeciales = { feriados: new Set(), bloqueados: new Set(), bloqueosIndividuales: {} };
  }
}

// ─── Vista SEMANA ──────────────────────────────────────────────────────────
function renderizarSemana(turnos, dias) {
  const lunes   = dias[0];
  const domingo = dias[6];
  actualizarLabelSemana(lunes, domingo);

  // Agrupar turnos por fecha
  const porFecha = {};
  for (const t of turnos) {
    const f = typeof t.fecha === 'string' ? t.fecha.substring(0, 10) : t.fecha;
    if (!porFecha[f]) porFecha[f] = [];
    porFecha[f].push(t);
  }

  // Slots de tiempo para las filas (08:00 a 17:30)
  const slots = generarSlotsTiempo('08:00', '17:30');

  // Encabezados de columnas (un día por columna).
  // Tres capas de color por prioridad:
  //   Rojo  (feriado) > Ámbar (bloqueo oficina) > Azul (bloqueo individual) > sin tinte
  const headerCols = dias.map((fecha, i) => {
    const d           = parseFecha(fecha);
    const num         = d.getDate();
    const mes         = d.getMonth() + 1;
    const esHoy       = fecha === HOY;
    const esFeriado   = diasEspeciales.feriados.has(fecha);
    const esBloqueado = !esFeriado && diasEspeciales.bloqueados.has(fecha);
    // Nombres de operadores con bloqueo individual en este día (puede ser más de uno)
    const nombresInd    = (!esFeriado && !esBloqueado)
                          ? (diasEspeciales.bloqueosIndividuales[fecha] || [])
                          : [];
    const esBloqueadoInd = nombresInd.length > 0;

    const headerBg    = esFeriado       ? 'background:#fef2f2;'
                      : esBloqueado     ? 'background:#fef3c7;'
                      : esBloqueadoInd  ? 'background:#eff6ff;'
                      : '';
    const headerColor = esHoy           ? 'color:#1A3C4B;'
                      : esFeriado       ? 'color:#dc2626;'
                      : esBloqueado     ? 'color:#92400e;'
                      : esBloqueadoInd  ? 'color:#1d4ed8;'
                      : '';

    // Una etiqueta por operador bloqueado; si hay muchos, se apilan en la columna
    const tagsInd = nombresInd
      .map(n => `<span class="encabezado-bloqueado-ind-tag">${esc(n.split(' ')[0])} — bloqueado</span>`)
      .join('');

    const tag = esFeriado      ? '<span class="encabezado-feriado-tag">Feriado</span>'
              : esBloqueado    ? '<span class="encabezado-bloqueado-tag">Sin atención</span>'
              : tagsInd;

    return `
      <th class="col-dia" style="${headerBg}${headerColor}">
        <span class="encabezado-dia-semana">${DIAS_CORTO[i]}</span>
        <span class="encabezado-num-semana">${num}/${String(mes).padStart(2,'0')}</span>
        ${tag}
      </th>`;
  }).join('');

  // Filas de tiempo.
  // Cada celda de un día especial hereda el mismo color de fondo del encabezado
  // para que toda la columna quede tintada, no solo el encabezado.
  // Prioridad: feriado > bloqueo oficina > bloqueo individual > hoy > normal
  const filas = slots.map(slot => {
    const celdas = dias.map(fecha => {
      const turnosDia = (porFecha[fecha] || [])
        .filter(t => t.hora_inicio.substring(0, 5) === slot);
      const esHoy         = fecha === HOY;
      const esFeriado     = diasEspeciales.feriados.has(fecha);
      const esBloqueado   = !esFeriado && diasEspeciales.bloqueados.has(fecha);
      const esBloqueadoInd = !esFeriado && !esBloqueado
                             && (diasEspeciales.bloqueosIndividuales[fecha] || []).length > 0;

      let claseCelda = '';
      if (esFeriado)       claseCelda = 'cel-feriado';
      else if (esBloqueado)  claseCelda = 'cel-bloqueado';
      else if (esBloqueadoInd) claseCelda = 'cel-bloqueado-ind';
      else if (esHoy)        claseCelda = 'cel-dia-hoy';
      // "hoy" con prioridad más baja que los colores de alerta para que, si hoy
      // es feriado o bloqueado, el color de alerta tenga prioridad visual.

      const cards = turnosDia.map(t => `
        <div class="turno-semana badge-${t.estado}" title="${esc(t.vecino_nombre)} — ${esc(t.servicio_nombre)}">
          ${esc(t.hora_inicio.substring(0,5))} ${esc(t.vecino_nombre.split(' ')[0])}
        </div>
      `).join('');
      return `<td${claseCelda ? ` class="${claseCelda}"` : ''}>${cards}</td>`;
    }).join('');
    return `<tr><td class="cel-hora">${slot}</td>${celdas}</tr>`;
  }).join('');

  document.getElementById('tabla-container').innerHTML = `
    <div class="tabla-semana-wrapper">
      <table class="tabla-semana">
        <thead>
          <tr>
            <th class="col-hora"></th>
            ${headerCols}
          </tr>
        </thead>
        <tbody>${filas}</tbody>
      </table>
    </div>
  `;
}

// ─── Vista MES ─────────────────────────────────────────────────────────────
function renderizarMes(turnos, año, mes) {
  actualizarLabelMes(año, mes);

  // Contar turnos por fecha
  const cuentaPorFecha = {};
  for (const t of turnos) {
    const f = typeof t.fecha === 'string' ? t.fecha.substring(0, 10) : t.fecha;
    cuentaPorFecha[f] = (cuentaPorFecha[f] || 0) + 1;
  }

  // Primer día del mes y lunes de esa semana
  const primerDia = new Date(año, mes - 1, 1);
  const diaSemana = primerDia.getDay(); // 0=Dom
  const diff      = diaSemana === 0 ? -6 : 1 - diaSemana;
  const primerCelda = new Date(año, mes - 1, 1 + diff);

  // Generar 42 celdas (6 semanas × 7 días)
  const headerDias = DIAS_CORTO.map(n =>
    `<div class="cal-nombre-dia">${n}</div>`
  ).join('');

  const celdas = [];
  const cur = new Date(primerCelda);
  for (let i = 0; i < 42; i++) {
    const fechaStr  = cur.toISOString().substring(0, 10);
    const esDelMes  = cur.getMonth() + 1 === mes;
    const esHoy     = fechaStr === HOY;
    const cuenta    = cuentaPorFecha[fechaStr] || 0;

    // Solo marcamos feriados/bloqueos en los días del mes visible.
    // Los días del mes anterior/siguiente (otro-mes) quedan opacos sin indicador.
    const esFeriado      = esDelMes && diasEspeciales.feriados.has(fechaStr);
    const esBloqueado    = esDelMes && !esFeriado && diasEspeciales.bloqueados.has(fechaStr);
    const nombresInd     = esDelMes && !esFeriado && !esBloqueado
                           ? (diasEspeciales.bloqueosIndividuales[fechaStr] || [])
                           : [];
    const esBloqueadoInd = nombresInd.length > 0;

    const clases = [
      'cal-dia',
      !esDelMes      ? 'otro-mes'         : '',
      esHoy          ? 'cal-hoy'          : '',
      esFeriado      ? 'cal-feriado'      : '',
      esBloqueado    ? 'cal-bloqueado'    : '',
      esBloqueadoInd ? 'cal-bloqueado-ind': '',
    ].filter(Boolean).join(' ');

    // Etiqueta(s) pequeñas dentro de la celda.
    // Para bloqueos individuales: si hay 1 operador se muestra su primer nombre;
    // si hay más de 1 se muestra la cantidad para no desbordar la celda.
    let indicadorInd = '';
    if (esBloqueadoInd) {
      indicadorInd = nombresInd.length === 1
        ? `<span class="cal-indicador bloqueado-ind">${esc(nombresInd[0].split(' ')[0])} — bloqueado</span>`
        : `<span class="cal-indicador bloqueado-ind">${nombresInd.length} bloqueados</span>`;
    }

    const indicador = esFeriado      ? '<span class="cal-indicador feriado">Feriado</span>'
                    : esBloqueado    ? '<span class="cal-indicador bloqueado">Sin atención</span>'
                    : indicadorInd;

    const onclick = esDelMes ? `irADiaDesdeCalendario('${fechaStr}')` : '';
    celdas.push(`
      <div class="${clases}" onclick="${onclick}">
        <span class="cal-num">${cur.getDate()}</span>
        ${indicador}
        ${cuenta > 0 ? `<span class="cal-count">${cuenta}</span>` : ''}
      </div>
    `);
    cur.setDate(cur.getDate() + 1);
  }

  document.getElementById('tabla-container').innerHTML = `
    <div class="vista-mes">
      <div class="cal-header-dias">${headerDias}</div>
      <div class="cal-grid">${celdas.join('')}</div>
    </div>
  `;
}

async function cargarMes() {
  const [año, mes] = fechaActual.split('-').map(Number);

  actualizarLabelMes(año, mes);
  mostrarAlerta(null);
  document.getElementById('tabla-container').innerHTML = '<div class="cargando">Cargando...</div>';

  // Rango: del 1 al último día del mes
  const ultimoDia = new Date(año, mes, 0).getDate();
  const desde     = `${año}-${String(mes).padStart(2,'0')}-01`;
  const hasta     = `${año}-${String(mes).padStart(2,'0')}-${String(ultimoDia).padStart(2,'0')}`;

  const operadorId = document.getElementById('select-operador')?.value || '';
  let url = `/panel/agenda/rango?desde=${desde}&hasta=${hasta}${areasParam()}`;
  if (operadorId) url += `&operadorId=${operadorId}`;

  // Igual que en cargarSemana: turnos y días especiales se piden al mismo tiempo
  const [res] = await Promise.all([
    apiFetch(url),
    cargarDiasEspeciales(desde, hasta),
  ]);
  if (!res) return;

  if (!res.ok) {
    const data = await res.json();
    mostrarAlerta('error', data.error || 'No se pudo cargar el mes.');
    document.getElementById('tabla-container').innerHTML = '';
    renderizarStats([]);
    return;
  }

  const turnos = await res.json();
  turnosActuales = turnos;
  renderizarStats(turnos);
  renderizarMes(turnos, año, mes);
}

// Desde el calendario mensual, ir a la vista día de esa fecha
function irADiaDesdeCalendario(fecha) {
  fechaActual = fecha;
  cambiarVista('dia');
  document.getElementById('fecha-input').value = fechaActual;
}

// ─── Tomar turno ──────────────────────────────────────────────────────────
// El operador presiona "Tomar" cuando el vecino llega a la ventanilla.
// Asigna el operador al turno y recarga la vista día para mostrar los botones de acción.
async function tomarTurno(id) {
  mostrarAlerta(null);
  const res = await apiFetch(`/panel/turno/${id}/tomar`, { method: 'PATCH' });
  if (!res) return;
  const data = await res.json();
  if (!res.ok) {
    mostrarAlerta('error', data.error || 'No se pudo tomar el turno.');
    return;
  }
  mostrarAlerta('ok', `Turno tomado por ${esc(data.operador_nombre)}.`);
  // Recargar la vista para que aparezcan los botones Presente/Ausente/Liberar
  cargar();
}

// ─── Liberar turno ─────────────────────────────────────────────────────────
// El operador (o un encargado) libera el turno: vuelve a quedar sin asignar.
async function liberarTurno(id) {
  mostrarAlerta(null);
  const res = await apiFetch(`/panel/turno/${id}/liberar`, { method: 'PATCH' });
  if (!res) return;
  const data = await res.json();
  if (!res.ok) {
    mostrarAlerta('error', data.error || 'No se pudo liberar el turno.');
    return;
  }
  mostrarAlerta('ok', 'Turno liberado. Quedó disponible para ser tomado.');
  // Recargar la vista para mostrar el badge "Sin tomar" y botones Tomar/Cancelar
  cargar();
}

// ─── Cambiar estado de turno ────────────────────────────────────────────────
async function cambiarEstado(id, estado) {
  mostrarAlerta(null);
  const res = await apiFetch(`/panel/turno/${id}/estado`, {
    method: 'PATCH',
    body: JSON.stringify({ estado }),
  });
  if (!res) return;
  const data = await res.json();
  if (!res.ok) {
    mostrarAlerta('error', data.error || 'No se pudo cambiar el estado.');
    return;
  }
  mostrarAlerta('ok', `Estado actualizado a "${ESTADOS[estado]}".`);

}

// ─── Cancelar turno ────────────────────────────────────────────────────────
function abrirCancelar(id) {
  const t = turnosActuales.find(x => x.id === id);
  turnoACancelar = id;
  document.getElementById('modal-info').textContent =
    `${esc(t.vecino_nombre)} (DNI ${t.vecino_dni}) — ${t.hora_inicio.substring(0,5)} hs`;
  document.getElementById('motivo-input').value = '';
  document.getElementById('modal-error').classList.remove('visible');
  document.getElementById('modal-error').style.display = 'none';
  document.getElementById('btn-confirmar').disabled = false;
  document.getElementById('modal-fondo').classList.add('abierto');
}

function cerrarModal() {
  document.getElementById('modal-fondo').classList.remove('abierto');
  turnoACancelar = null;
}

async function confirmarCancelacion() {
  const motivo     = document.getElementById('motivo-input').value.trim();
  const errorModal = document.getElementById('modal-error');

  if (motivo.length < 5) {
    errorModal.textContent = 'El motivo es obligatorio (mínimo 5 caracteres).';
    errorModal.style.display = 'block';
    return;
  }
  errorModal.style.display = 'none';

  const btn = document.getElementById('btn-confirmar');
  btn.disabled    = true;
  btn.textContent = 'Cancelando...';

  const res = await apiFetch(`/panel/turno/${turnoACancelar}`, {
    method: 'DELETE',
    body:   JSON.stringify({ motivo }),
  });

  btn.disabled    = false;
  btn.textContent = 'Confirmar cancelación';

  if (!res) return;
  const data = await res.json();

  if (!res.ok) {
    errorModal.textContent = data.error || 'No se pudo cancelar el turno.';
    errorModal.style.display = 'block';
    return;
  }

  cerrarModal();
  mostrarAlerta('ok', 'Turno cancelado correctamente.');
  cargar();
}

// ─── Encargado: cargar dropdown de operadores ──────────────────────────────
async function cargarOperadores() {
  const res = await apiFetch('/panel/operadores');
  if (!res || !res.ok) return;
  const operadores = await res.json();
  const select = document.getElementById('select-operador');
  operadores.forEach(op => {
    const opt = document.createElement('option');
    opt.value       = op.id;
    opt.textContent = op.nombre;
    select.appendChild(opt);
  });
}

// ─── Init ──────────────────────────────────────────────────────────────────
(async function init() {
  const token = getToken();
  if (!token) return;

  const usuario = getUsuario();
  usuarioRol = usuario.rol;  // guardar en variable global para renderizarAcciones()

  // Badge de rol junto al nombre — se muestra para todos los roles
  const nombreEl = document.getElementById('nav-nombre');
  nombreEl.innerHTML = esc(usuario.nombre) + ' ' + rolBadgeHTML(usuario.rol);

  // Filtro de operador visible para quien puede ver todos los turnos
  if (['encargado', 'sistemas', 'directivo'].includes(usuario.rol)) {
    document.getElementById('filtro-operador').style.display = 'flex';
    await cargarOperadores();
  }

  // Links de administración para roles con acceso al backoffice
  if (['encargado', 'sistemas', 'directivo'].includes(usuario.rol)) {
    ['nav-auditoria', 'nav-dashboard', 'nav-usuarios', 'nav-servicios'].forEach(id => {
      const el = document.getElementById(id);
      if (el) el.style.display = '';
    });
  }

  // B9: cargar áreas accesibles y construir chips si hay más de una
  const resAreas = await apiFetch('/panel/areas');
  if (resAreas && resAreas.ok) {
    todasLasAreas = await resAreas.json();
    inicializarChipsAgenda();
  }

  document.getElementById('fecha-input').value = fechaActual;
  actualizarLabelDia();
  await cargarDia();

  document.getElementById('modal-fondo').addEventListener('click', (e) => {
    if (e.target === document.getElementById('modal-fondo')) cerrarModal();
  });
})();
