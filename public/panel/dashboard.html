<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard — Panel MVLA</title>
  <link rel="icon" type="image/png" href="/assets/escudo_vla_web.png">
  <script>
    (function() {
      if (localStorage.getItem('panel_tema') === 'light') {
        document.documentElement.setAttribute('data-theme', 'light');
      }
    })();
  </script>
  <link rel="stylesheet" href="/assets/design-tokens.css">
  <style>
    /* ══════════════════════════════════════════════════════════════
       dashboard.html — estilos locales (design system C+)
       Todos los colores vienen de design-tokens.css.
    ══════════════════════════════════════════════════════════════ */

    /* ── Layout shell ─────────────────────────────────────────── */
    .app-shell    { display: flex; height: 100vh; overflow: hidden; }
    .main-content { flex: 1; overflow-y: auto; background: var(--bg-2); }
    .page-inner   { max-width: 1100px; margin: 0 auto; padding: 2rem 1.5rem; }

    /* ── Header de página ─────────────────────────────────────── */
    .page-supertitle {
      font-size: var(--text-xs);
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--teal);
      margin-bottom: 0.2rem;
    }
    .page-title {
      font-size: var(--text-xl);
      font-weight: 800;
      color: var(--text-1);
      margin-bottom: 1.5rem;
    }

    /* ── Sidebar ──────────────────────────────────────────────── */
    .sidebar {
      width: var(--sidebar-width);
      background: var(--bg-1);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
      overflow-y: auto;
    }
    .sidebar-header {
      display: flex;
      align-items: center;
      gap: var(--gap-sm);
      padding: 14px 12px 10px;
      border-bottom: 1px solid var(--border);
    }
    .sidebar-logo {
      width: 36px; height: 36px;
      border-radius: var(--radius-xl);
      background: var(--teal-dim);
      color: var(--teal);
      display: flex; align-items: center; justify-content: center;
      font-size: 11px; font-weight: 800;
      flex-shrink: 0;
      letter-spacing: 0.04em;
    }
    .sidebar-muni {
      font-size: 8.5px; font-weight: 700;
      text-transform: uppercase; letter-spacing: 0.05em;
      color: var(--text-3);
    }
    .sidebar-ciudad {
      font-size: 12.5px; font-weight: 700;
      color: var(--text-1);
    }
    .sidebar-user-card {
      margin: 8px;
      padding: 7px 9px;
      border-radius: var(--radius-md);
      display: flex;
      align-items: center;
      gap: var(--gap-sm);
    }
    .sidebar-avatar {
      width: 28px; height: 28px;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: var(--text-xs); font-weight: 700;
      flex-shrink: 0;
    }
    .nav-section-label {
      font-size: 8.5px; font-weight: 700;
      text-transform: uppercase; letter-spacing: 0.1em;
      color: var(--text-3);
      padding: 10px 12px 4px;
    }
    .sidebar-nav { padding: 0 6px; flex: 1; }
    .sidebar-footer {
      border-top: 1px solid var(--border);
      padding: 10px 12px;
    }
    .btn-logout-sidebar {
      background: transparent;
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      color: var(--text-2);
      padding: 5px 10px;
      font-family: var(--font-ui);
      font-size: var(--text-sm);
      cursor: pointer;
      width: 100%;
      transition: var(--transition-fast);
    }
    .btn-logout-sidebar:hover {
      background: var(--bg-4);
      border-color: var(--border-hi);
      color: var(--text-1);
    }
    .btn-tema-toggle {
      background: transparent;
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      color: var(--text-2);
      padding: 5px 10px;
      font-family: var(--font-ui);
      font-size: var(--text-sm);
      cursor: pointer;
      width: 100%;
      margin-bottom: 6px;
      transition: var(--transition-fast);
    }
    .btn-tema-toggle:hover {
      background: var(--bg-4);
      border-color: var(--border-hi);
      color: var(--text-1);
    }

    /* ── Card ─────────────────────────────────────────────────── */
    .card {
      background: var(--bg-3);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 1.25rem 1.5rem;
      margin-bottom: 1rem;
    }
    .card-titulo {
      font-family: var(--font-ui);
      font-size: var(--text-lg);
      font-weight: 700;
      color: var(--text-1);
      margin-bottom: 1rem;
    }

    /* ── Selector de período ─────────────────────────────────── */
    .periodo-bar { display: flex; align-items: center; gap: 0.75rem; flex-wrap: wrap; }
    .btn-group-periodo {
      display: inline-flex;
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      overflow: hidden;
    }
    .btn-periodo {
      background: var(--bg-3);
      border: none;
      border-right: 1px solid var(--border);
      padding: 0.38rem 0.9rem;
      cursor: pointer;
      font-size: var(--text-sm);
      font-weight: 500;
      color: var(--text-2);
      font-family: var(--font-ui);
      transition: var(--transition-fast);
    }
    .btn-periodo:last-child { border-right: none; }
    .btn-periodo.activo {
      background: var(--teal-dim);
      border-color: var(--teal-mid);
      color: var(--teal);
      font-weight: 600;
    }
    .btn-periodo:hover:not(.activo) { background: var(--bg-4); color: var(--text-1); }

    /* ── Campos de fecha personalizada ───────────────────────── */
    .campos-custom { display: none; align-items: center; gap: 0.5rem; }
    .campos-custom.visible { display: flex; }
    .fecha-sep { color: var(--text-3); }
    input[type="date"] {
      padding: 0.38rem 0.6rem;
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      font-size: var(--text-sm);
      font-family: var(--font-ui);
      background: var(--bg-4);
      color: var(--text-1);
      cursor: pointer;
      transition: var(--transition-fast);
    }
    input[type="date"]:focus { outline: none; border-color: var(--border-hi); }

    /* ── Grillas de métricas ─────────────────────────────────── */
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
    .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1rem; }
    @media (max-width: 720px) { .grid-2, .grid-3 { grid-template-columns: 1fr; } }

    /* ── Stat grande (tasa de ausentismo) ────────────────────── */
    .stat-grande { text-align: center; padding: 0.5rem 0; }
    .stat-numero {
      font-family: var(--font-mono);
      font-size: var(--text-kpi);
      font-weight: 800;
      color: var(--teal);   /* el inline style del JS lo sobreescribe condicionalmente */
      line-height: 1;
    }
    .stat-label { font-size: var(--text-sm); color: var(--text-2); margin-top: 0.3rem; }

    /* ── Tabla de estados ────────────────────────────────────── */
    .tabla-estados { width: 100%; border-collapse: collapse; }
    .tabla-estados td {
      padding: 0.5rem;
      border-bottom: 1px solid var(--border);
      font-size: var(--text-base);
    }
    .tabla-estados tr:last-child td { border-bottom: none; }
    .tabla-estados .num { font-weight: 700; text-align: right; }

    /* ── Dot de color (indicador de estado/canal) ────────────── */
    /* El color real viene del inline style del JS (datos de visualización) */
    .dot {
      display: inline-block;
      width: 9px; height: 9px;
      border-radius: 50%;
      margin-right: 0.4rem;
      flex-shrink: 0;
    }

    /* ── Leyenda del gráfico de torta ────────────────────────── */
    .leyenda { margin-top: 0.75rem; display: flex; flex-wrap: wrap; gap: 0.5rem; }
    .leyenda-item {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      font-size: var(--text-sm);
      color: var(--text-2);
    }

    /* ── Tabla de operadores ─────────────────────────────────── */
    .tabla-op { width: 100%; border-collapse: collapse; }
    .tabla-op td {
      padding: 0.45rem 0.5rem;
      border-bottom: 1px solid var(--border);
      font-size: var(--text-base);
    }
    .tabla-op tr:last-child td { border-bottom: none; }
    .tabla-op .num { font-weight: 700; color: var(--teal); text-align: right; }
    .tabla-op .pos { color: var(--text-3); font-size: var(--text-xs); width: 24px; }

    /* ── Alerta de error ─────────────────────────────────────── */
    .alerta {
      padding: 0.7rem 1rem;
      border-radius: var(--radius-md);
      font-size: var(--text-sm);
      margin-bottom: 1rem;
      display: none;
    }
    .alerta.visible { display: block; }
    .alerta-error { background: var(--red-dim); border: 1px solid var(--red-mid); color: var(--red); }

    /* ── Carga y vacío ───────────────────────────────────────── */
    .cargando { text-align: center; color: var(--text-3); padding: 2rem; font-style: italic; }
    .vacio    { text-align: center; color: var(--text-3); padding: 1.5rem; font-size: var(--text-sm); }

    /* ── Selector de área (B9) ───────────────────────────────── */
    .area-selector { margin-bottom: 1rem; display: none; }
    .area-selector.visible { display: block; }
    .area-selector-titulo {
      font-size: var(--text-xs);
      font-weight: 600;
      color: var(--text-3);
      text-transform: uppercase;
      letter-spacing: 0.04em;
      margin-bottom: 0.4rem;
    }
    .area-chips { display: flex; flex-wrap: wrap; gap: 0.4rem; }
    .area-chip {
      display: inline-flex;
      align-items: center;
      padding: 3px 10px;
      border-radius: 20px;
      border: 1px solid var(--border);
      font-size: var(--text-sm);
      font-weight: 500;
      cursor: pointer;
      color: var(--text-2);
      background: transparent;
      transition: var(--transition-fast);
      user-select: none;
    }
    .area-chip:hover  { background: var(--bg-4); border-color: var(--border-hi); color: var(--text-1); }
    .area-chip.activo { background: var(--teal-dim); border-color: var(--teal-mid); color: var(--teal); font-weight: 600; }
  </style>
</head>
<body>

<div class="app-shell">

    <div class="sidebar-header">
      <div class="sidebar-logo"><img src="/assets/escudo_vla_web_color.png" alt="Municipalidad de Villa La Angostura" style="width: 100%; height: 100%; object-fit: contain;"></div>
      <div>
        <div class="sidebar-muni">Municipalidad</div>

<script>
// ─── Auth ──────────────────────────────────────────────────────────────────
function getToken() {
  const t = sessionStorage.getItem('panel_token');
  if (!t) { window.location.href = '/panel/login.html'; return null; }
  return t;
}
function getUsuario() { return JSON.parse(sessionStorage.getItem('panel_usuario') || '{}'); }
async function apiFetch(url, opts = {}) {
  const token = getToken();
  if (!token) return null;
  const res = await fetch(url, {
    ...opts,
    headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${token}`, ...opts.headers },
  });
  if (res.status === 401) { sessionStorage.clear(); window.location.href = '/panel/login.html'; return null; }
  return res;
}
async function cerrarSesion() {
  try { await apiFetch('/panel/logout', { method: 'POST' }); } catch {}
  sessionStorage.clear(); window.location.href = '/panel/login.html';
}

// ─── Tema claro/oscuro ───────────────────────────────────────────────────────
// Persiste en localStorage (panel_tema) — a diferencia del JWT, es una
// preferencia de usuario, no un dato de sesión, así que sobrevive al cierre
// del navegador. El botón siempre describe la acción (a qué modo cambia al
// hacer clic), no el estado actual.
function actualizarTextoTema() {
  const claro = document.documentElement.getAttribute('data-theme') === 'light';
  const texto = document.getElementById('texto-tema');
  if (texto) texto.textContent = claro ? 'Modo oscuro' : 'Modo claro';
}
function toggleTema() {
  const claro = document.documentElement.getAttribute('data-theme') === 'light';
  if (claro) {
    document.documentElement.removeAttribute('data-theme');
    localStorage.setItem('panel_tema', 'dark');
  } else {
    document.documentElement.setAttribute('data-theme', 'light');
    localStorage.setItem('panel_tema', 'light');
  }
  actualizarTextoTema();
}

// ─── Estado global B9 ─────────────────────────────────────────────────────
let todasLasAreas = [];

// Construye los chips de área para el dashboard.
function inicializarChipsDash() {
  const selector  = document.getElementById('selector-areas-dash');
  const container = document.getElementById('chips-areas-dash');
  if (todasLasAreas.length <= 1) return;

  selector.classList.add('visible');

  const chipTodas = document.createElement('span');
  chipTodas.className   = 'area-chip activo';
  chipTodas.textContent = 'Todas';
  chipTodas.dataset.id  = 'todas';
  chipTodas.onclick = () => {
    container.querySelectorAll('.area-chip').forEach(c => c.classList.remove('activo'));
    chipTodas.classList.add('activo');
    cargar();
  };
  container.appendChild(chipTodas);

  todasLasAreas.forEach(a => {
    const chip = document.createElement('span');
    chip.className   = 'area-chip';
    chip.textContent = a.nombre;
    chip.dataset.id  = String(a.id);
    chip.onclick = () => {
      chipTodas.classList.remove('activo');
      chip.classList.toggle('activo');
      const hayActivos = container.querySelectorAll('.area-chip.activo:not([data-id="todas"])').length > 0;
      if (!hayActivos) chipTodas.classList.add('activo');
      cargar();
    };
    container.appendChild(chip);
  });
}

// Devuelve "&areas[]=N&areas[]=M" según chips activos, o "" si "Todas".
function areasParam() {
  const container = document.getElementById('chips-areas-dash');
  if (!container || container.children.length === 0) return '';
  const chipTodas = container.querySelector('[data-id="todas"]');
  if (chipTodas?.classList.contains('activo')) return '';
  const activos = [...container.querySelectorAll('.area-chip.activo:not([data-id="todas"])')];
  if (!activos.length) return '';
  return activos.map(c => `&areas[]=${c.dataset.id}`).join('');
}

// ─── Helpers ───────────────────────────────────────────────────────────────
function esc(s) { return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function rolBadgeHTML(rol) {
  const cfg = {
    operador:  { cls: 'role-operador',  label: 'Operador'     },
    encargado: { cls: 'role-encargado', label: 'Encargado'    },
    sistemas:  { cls: 'role-sistemas',  label: 'Sistemas'     },
    directivo: { cls: 'role-directivo', label: 'Solo lectura' },
  };
  const { cls, label } = cfg[rol] || { cls: 'role-admin', label: rol };
  return `<span class="role-badge ${cls}">${label}</span>`;
}

function mostrarError(msg) {
  const el = document.getElementById('alerta-error');
  if (msg) { el.textContent = msg; el.classList.add('visible'); }
  else      { el.classList.remove('visible'); }
}

// Calcular rango de fechas según el período seleccionado
function rangoFechas(periodo) {
  const hoy   = new Date();
  const hasta = hoy.toISOString().substring(0, 10);
  let desde;
  if (periodo === 'semana') {
    const d = new Date(hoy); d.setDate(d.getDate() - 6);
    desde = d.toISOString().substring(0, 10);
  } else if (periodo === 'mes') {
    const d = new Date(hoy); d.setDate(d.getDate() - 29);
    desde = d.toISOString().substring(0, 10);
  } else if (periodo === 'trimestre') {
    const d = new Date(hoy); d.setDate(d.getDate() - 89);
    desde = d.toISOString().substring(0, 10);
  }
  return { desde, hasta };
}

// ─── Gráfico de torta (SVG) ────────────────────────────────────────────────
const COLORES_CANAL = { whatsapp: '#25d366', web: '#3b82f6', presencial: '#f59e0b' };
const NOMBRES_CANAL = { whatsapp: 'WhatsApp', web: 'Web', presencial: 'Presencial' };

function svgTorta(datos, radio) {
  // datos: [{ label, valor, color }]
  const total = datos.reduce((s, d) => s + d.valor, 0);
  if (total === 0) return `<p class="vacio">Sin datos para el período.</p>`;

  const cx = radio + 5, cy = radio + 5;
  const r  = radio;
  let paths  = '';

  const conValor = datos.filter(d => d.valor > 0);

  if (conValor.length === 1) {
    // Una sola categoría al 100%: el punto de inicio y fin de un arco de
    // 360° coinciden (o casi, por redondeo de punto flotante), y SVG no
    // puede dibujar un arco degenerado de esa forma — no se ve nada. Un
    // <circle> completo evita el caso por completo en vez de intentar
    // ajustar el redondeo de los ángulos.
    paths = `<circle cx="${cx}" cy="${cy}" r="${r}" fill="${conValor[0].color}" stroke="white" stroke-width="2"/>`;
  } else {
    let angulo = -Math.PI / 2; // empezar arriba
    datos.forEach(d => {
      if (d.valor === 0) return;
      const pct  = d.valor / total;
      const ang2 = angulo + pct * 2 * Math.PI;
      const x1 = cx + r * Math.cos(angulo);
      const y1 = cy + r * Math.sin(angulo);
      const x2 = cx + r * Math.cos(ang2);
      const y2 = cy + r * Math.sin(ang2);
      const large = pct > 0.5 ? 1 : 0;
      paths += `<path d="M${cx},${cy} L${x1},${y1} A${r},${r} 0 ${large},1 ${x2},${y2} Z"
                      fill="${d.color}" stroke="white" stroke-width="2"/>`;
      angulo = ang2;
    });
  }

  const size = (radio + 5) * 2;
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">${paths}</svg>`;
}

// ─── Gráfico de barras (SVG) ───────────────────────────────────────────────
function svgBarras(datos, alto, color) {
  // datos: [{ label, valor }]
  if (!datos || datos.length === 0) return `<p class="vacio">Sin datos para el período.</p>`;

  const maxVal   = Math.max(...datos.map(d => d.valor), 1);
  const ancho    = Math.max(datos.length * 52, 280);
  const barW     = Math.min(38, Math.floor(ancho / datos.length) - 10);
  const padL     = 36; const padB = 28; const padT = 12; const padR = 8;
  const grafH    = alto - padT - padB;
  const grafW    = ancho - padL - padR;
  const paso     = grafW / datos.length;

  let barras = '';
  let etiqX  = '';
  let etiqV  = '';

  datos.forEach((d, i) => {
    const h   = Math.round((d.valor / maxVal) * grafH);
    const x   = padL + i * paso + (paso - barW) / 2;
    const y   = padT + grafH - h;
    barras += `<rect x="${x}" y="${y}" width="${barW}" height="${h}" fill="${color}" rx="3"/>`;
    // Etiqueta eje X
    etiqX += `<text x="${padL + i * paso + paso / 2}" y="${alto - 4}"
                    text-anchor="middle" font-size="10" fill="#94a3b8">${esc(String(d.label))}</text>`;
    // Valor encima de la barra (solo si hay espacio)
    if (d.valor > 0) {
      etiqV += `<text x="${x + barW / 2}" y="${y - 3}"
                      text-anchor="middle" font-size="10" fill="#374151">${d.valor}</text>`;
    }
  });

  // Línea base
  const linea = `<line x1="${padL}" y1="${padT + grafH}" x2="${padL + grafW}" y2="${padT + grafH}"
                        stroke="#e2e8f0" stroke-width="1"/>`;

  return `<div style="overflow-x:auto">
    <svg width="${ancho}" height="${alto}" viewBox="0 0 ${ancho} ${alto}">
      ${linea}${barras}${etiqX}${etiqV}
    </svg>
  </div>`;
}

// ─── Renderizar dashboard ──────────────────────────────────────────────────
const DIAS_SEMANA = ['Lunes', 'Martes', 'Miércoles', 'Jueves', 'Viernes', 'Sábado', 'Domingo'];
const COLORES_ESTADO = {
  agendado: '#93c5fd', presente: '#86efac', atendido: '#d1d5db', ausente: '#fca5a5', cancelado: '#e2e8f0'
};
const NOMBRES_ESTADO = {
  agendado: 'Agendado', presente: 'Presente', atendido: 'Atendido', ausente: 'Ausente', cancelado: 'Cancelado'
};

function renderDashboard(data) {
  // ── Totales por estado ──────────────────────────────────────────────────
  const estadoMap = {};
  (data.porEstado || []).forEach(r => { estadoMap[r.estado] = Number(r.cantidad); });
  const totalGeneral = Object.values(estadoMap).reduce((s, v) => s + v, 0);

  const filasEstado = ['agendado', 'presente', 'atendido', 'ausente', 'cancelado'].map(e => {
    const n = estadoMap[e] || 0;
    const pct = totalGeneral > 0 ? Math.round(n / totalGeneral * 100) : 0;
    return `<tr>
      <td><span class="dot" style="background:${COLORES_ESTADO[e]||'#ccc'}"></span>${NOMBRES_ESTADO[e] || e}</td>
      <td class="num">${n}</td>
      <td style="color:#94a3b8;text-align:right">${pct}%</td>
    </tr>`;
  }).join('');

  // ── Torta de canal ──────────────────────────────────────────────────────
  const canalDatos = (data.porCanal || []).map(r => ({
    label: NOMBRES_CANAL[r.canal_origen] || r.canal_origen,
    valor: Number(r.cantidad),
    color: COLORES_CANAL[r.canal_origen] || '#94a3b8',
  }));
  const tortaHTML = svgTorta(canalDatos, 80);
  const leyendaHTML = canalDatos.map(d =>
    `<span class="leyenda-item"><span class="dot" style="background:${d.color}"></span>${esc(d.label)}: <strong>${d.valor}</strong></span>`
  ).join('');

  // ── Tasa de ausentismo ──────────────────────────────────────────────────
  const tasa = data.tasaAusentismo ?? '0.0';

  // ── Operadores top ──────────────────────────────────────────────────────
  const opRows = (data.porOperador || []).length > 0
    ? (data.porOperador || []).map((op, i) =>
        `<tr>
          <td class="pos">${i + 1}°</td>
          <td>${esc(op.operador)}</td>
          <td class="num">${op.atendidos}</td>
        </tr>`).join('')
    : `<tr><td colspan="3" class="vacio">Sin datos.</td></tr>`;

  // ── Día de semana con más demanda ────────────────────────────────────────
  const diasData = Array.from({ length: 7 }, (_, i) => ({
    label: ['L','M','X','J','V','S','D'][i],
    valor: 0,
  }));
  (data.porDia || []).forEach(d => { diasData[d.dia_semana].valor = Number(d.cantidad); });
  const barrasDia = svgBarras(diasData, 130, '#1A3C4B');

  // ── Evolución semanal ───────────────────────────────────────────────────
  const semanasData = (data.evolucionSemanal || []).map(s => ({
    label: String(s.inicio_semana || s.semana_iso).substring(5, 10), // MM-DD
    valor: Number(s.cantidad),
  }));
  const barrasSemana = semanasData.length > 0
    ? svgBarras(semanasData, 150, '#3b82f6')
    : `<p class="vacio">Sin datos para el período.</p>`;

  document.getElementById('contenido').innerHTML = `
    <!-- Fila 1: estados + canal -->
    <div class="grid-2">
      <div class="card">
        <div class="card-titulo">Turnos por estado</div>
        <table class="tabla-estados">${filasEstado}</table>
        <div style="margin-top:.75rem;font-size:.78rem;color:#64748b">Total del período: <strong>${totalGeneral}</strong></div>
      </div>
      <div class="card">
        <div class="card-titulo">Canal de origen</div>
        <div style="display:flex;align-items:center;gap:1.5rem;flex-wrap:wrap">
          ${tortaHTML}
          <div>
            <div class="leyenda">${leyendaHTML}</div>
          </div>
        </div>
      </div>
    </div>

    <!-- Fila 2: ausentismo + operadores top -->
    <div class="grid-2">
      <div class="card">
        <div class="card-titulo">Tasa de ausentismo</div>
        <div class="stat-grande">
          <div class="stat-numero" style="color:${parseFloat(tasa) > 20 ? '#dc2626' : '#1A3C4B'}">${tasa}%</div>
          <div class="stat-label">Ausentes / (Presentes + Ausentes + Atendidos)</div>
        </div>
      </div>
      <div class="card">
        <div class="card-titulo">Operadores con más turnos atendidos</div>
        <table class="tabla-op">
          <thead><tr>
            <th style="font-size:.72rem;color:#64748b;padding:.4rem .5rem;border-bottom:1px solid #e2e8f0"></th>
            <th style="font-size:.72rem;color:#64748b;padding:.4rem .5rem;border-bottom:1px solid #e2e8f0">Operador</th>
            <th style="font-size:.72rem;color:#64748b;padding:.4rem .5rem;border-bottom:1px solid #e2e8f0;text-align:right">Atendidos</th>
          </tr></thead>
          <tbody>${opRows}</tbody>
        </table>
      </div>
    </div>

    <!-- Fila 3: día de semana -->
    <div class="card">
      <div class="card-titulo">Demanda por día de la semana</div>
      ${barrasDia}
    </div>

    <!-- Fila 4: evolución semanal -->
    <div class="card">
      <div class="card-titulo">Evolución semanal de turnos (no cancelados)</div>
      ${barrasSemana}
    </div>
  `;
}

// ─── Período ───────────────────────────────────────────────────────────────
let periodoActual = 'mes';
let desdeActual, hastaActual;

function elegirPeriodo(p) {
  // Actualizar botones
  document.querySelectorAll('.btn-periodo').forEach(b => b.classList.remove('activo'));
  event.target.classList.add('activo');

  const camposCustom = document.getElementById('campos-custom');
  if (p === 'custom') {
    camposCustom.classList.add('visible');
    periodoActual = 'custom';
    return;
  }
  camposCustom.classList.remove('visible');
  periodoActual = p;
  const { desde, hasta } = rangoFechas(p);
  desdeActual = desde; hastaActual = hasta;
  cargar();
}

function aplicarCustom() {
  desdeActual = document.getElementById('custom-desde').value;
  hastaActual = document.getElementById('custom-hasta').value;
  if (!desdeActual || !hastaActual) {
    mostrarError('Seleccioná ambas fechas para el período personalizado.');
    return;
  }
  if (desdeActual > hastaActual) {
    mostrarError('La fecha de inicio debe ser anterior a la fecha de fin.');
    return;
  }
  mostrarError('');
  cargar();
}

async function cargar() {
  mostrarError('');
  document.getElementById('contenido').innerHTML = '<div class="card cargando">Cargando estadísticas...</div>';

  const res = await apiFetch(`/panel/estadisticas?desde=${desdeActual}&hasta=${hastaActual}${areasParam()}`);
  if (!res) return;

  const data = await res.json();
  if (!res.ok) { mostrarError(data.error || 'Error al cargar estadísticas.'); return; }

  renderDashboard(data);
}

// ─── Init ──────────────────────────────────────────────────────────────────
(async function init() {
  const token = getToken();
  if (!token) return;

  const usuario = getUsuario();

  if (!['encargado', 'sistemas', 'directivo'].includes(usuario.rol)) {
    window.location.href = '/panel/agenda.html';
    return;
  }

  actualizarTextoTema();

  const nombreEl = document.getElementById('nav-nombre');
  nombreEl.innerHTML = esc(usuario.nombre) + ' ' + rolBadgeHTML(usuario.rol);

  // Avatar del sidebar: iniciales + fondo/color según rol
  const avatarEl = document.getElementById('sidebar-avatar');
  if (avatarEl) {
    const partes    = (usuario.nombre || '').trim().split(/\s+/);
    const iniciales = partes.slice(0, 2).map(p => p[0] || '').join('').toUpperCase() || '?';
    const avatarCfg = {
      encargado: { bg: 'var(--teal-mid)',  color: 'var(--teal)'  },
      operador:  { bg: 'var(--blue-mid)',  color: 'var(--blue)'  },
      sistemas:  { bg: 'var(--amber-mid)', color: 'var(--amber)' },
      directivo: { bg: 'var(--amber-mid)', color: 'var(--amber)' },
    };
    const ac = avatarCfg[usuario.rol] || avatarCfg.operador;
    avatarEl.textContent      = iniciales;
    avatarEl.style.background = ac.bg;
    avatarEl.style.color      = ac.color;
  }

  ['nav-auditoria', 'nav-usuarios', 'nav-servicios'].forEach(id => {
    const el = document.getElementById(id);
    if (el) el.style.display = '';
  });

  // Mostrar labels de sección del sidebar
  // Todos los roles que llegan aquí son encargado/sistemas/directivo
  // (el redirect de arriba descarta al resto), por lo que se muestran siempre.
  const lRep = document.getElementById('label-reportes');
  if (lRep) lRep.style.display = '';
  const lAdm = document.getElementById('label-admin');
  if (lAdm) lAdm.style.display = '';

  // Áreas: exclusivo rol sistemas
  if (usuario.rol === 'sistemas') {
    const elArea = document.getElementById('nav-areas');
    if (elArea) elArea.style.display = '';
  }

  // B9: cargar áreas accesibles y construir chips si hay más de una
  const resAreas = await apiFetch('/panel/areas');
  if (resAreas && resAreas.ok) {
    todasLasAreas = await resAreas.json();
    inicializarChipsDash();
  }

  const { desde, hasta } = rangoFechas('mes');
  desdeActual = desde; hastaActual = hasta;
  await cargar();
})();
</script>
