<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Usuarios — Panel MVLA</title>
  <link rel="icon" type="image/png" href="/assets/escudo_vla_web.png">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; background: #f1f5f9; color: #1e293b; min-height: 100vh; font-size: 14px; }

    /* Navbar */
    .navbar { background: #1A3C4B; color: white; display: flex; align-items: center; padding: 0 1.5rem; height: 52px; gap: 1.5rem; position: sticky; top: 0; z-index: 50; box-shadow: 0 2px 4px rgba(0,0,0,.2); }
    .nav-logo { height: 34px; display: block; }
    .nav-links { display: flex; gap: 0.25rem; flex: 1; }
    .nav-links a { color: rgba(255,255,255,.75); text-decoration: none; padding: 0.4rem 0.9rem; border-radius: 5px; font-size: 0.875rem; }
    .nav-links a:hover, .nav-links a.activo { background: rgba(255,255,255,.15); color: #fff; }
    .nav-user { display: flex; align-items: center; gap: 0.75rem; font-size: 0.85rem; }
    .nav-user span { color: rgba(255,255,255,.85); }
    .btn-logout { background: rgba(255,255,255,.1); border: 1px solid rgba(255,255,255,.2); color: white; padding: 0.3rem 0.75rem; border-radius: 5px; cursor: pointer; font-size: 0.8rem; font-family: inherit; }
    .btn-logout:hover { background: rgba(255,255,255,.2); }
    .badge-rol { font-size: 0.7rem; padding: 0.15rem 0.5rem; border-radius: 99px; font-weight: 600; margin-left: 0.4rem; }

    /* Layout */
    .container { max-width: 1100px; margin: 0 auto; padding: 1.25rem 1.5rem; }
    h1 { font-family: 'Trebuchet MS', Trebuchet, sans-serif; font-size: 1.25rem; color: #1A3C4B; margin-bottom: 1rem; }

    /* Card */
    .card { background: white; border-radius: 8px; box-shadow: 0 1px 3px rgba(0,0,0,.08); padding: 1rem 1.25rem; margin-bottom: 1rem; }
    .card-titulo { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; font-family: 'Trebuchet MS', Trebuchet, sans-serif; font-weight: 700; color: #1A3C4B; font-size: 0.95rem; }

    /* Botones */
    .btn { display: inline-flex; align-items: center; gap: 0.3rem; padding: 0.4rem 0.8rem; border: none; border-radius: 6px; cursor: pointer; font-size: 0.8rem; font-weight: 500; font-family: inherit; transition: opacity 0.15s; white-space: nowrap; }
    .btn:hover:not(:disabled) { opacity: 0.85; }
    .btn:disabled { opacity: 0.45; cursor: not-allowed; }
    .btn-primary { background: #1A3C4B; color: white; }
    .btn-ghost   { background: white; color: #374151; border: 1px solid #d1d5db; }
    .btn-danger  { background: #dc2626; color: white; }
    .btn-sm      { padding: 0.25rem 0.6rem; font-size: 0.75rem; }

    /* Alerta */
    .alerta { padding: 0.7rem 1rem; border-radius: 6px; font-size: 0.875rem; margin-bottom: 1rem; display: none; }
    .alerta.visible { display: block; }
    .alerta-error { background: #fef2f2; border: 1px solid #fecaca; color: #991b1b; }
    .alerta-ok    { background: #f0fdf4; border: 1px solid #bbf7d0; color: #166534; }

    /* Tabla */
    .tabla-wrapper { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; }
    th { background: #f8fafc; color: #64748b; font-weight: 600; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.04em; padding: 0.7rem 1rem; border-bottom: 2px solid #e2e8f0; text-align: left; white-space: nowrap; }
    td { padding: 0.8rem 1rem; border-bottom: 1px solid #f1f5f9; vertical-align: middle; }
    tr:last-child td { border-bottom: none; }
    tr:hover td { background: #fafafa; }
    .td-acciones { display: flex; gap: 0.35rem; }

    /* Badges */
    .badge { display: inline-block; padding: 0.18rem 0.55rem; border-radius: 99px; font-size: 0.72rem; font-weight: 600; }
    .badge-operador  { background: #dbeafe; color: #1e40af; }
    .badge-encargado { background: #fef3c7; color: #92400e; }
    .badge-sistemas  { background: #ede9fe; color: #6d28d9; }
    .badge-activo    { background: #dcfce7; color: #166534; }
    .badge-inactivo  { background: #fee2e2; color: #b91c1c; }

    /* Formulario */
    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem; }
    @media (max-width: 600px) { .form-grid { grid-template-columns: 1fr; } }
    .form-grupo { display: flex; flex-direction: column; gap: 0.3rem; }
    .form-grupo label { font-size: 0.82rem; font-weight: 500; color: #374151; }
    .form-grupo input, .form-grupo select { padding: 0.4rem 0.65rem; border: 1px solid #d1d5db; border-radius: 6px; font-size: 0.875rem; font-family: inherit; background: white; }
    .form-grupo input:focus, .form-grupo select:focus { outline: none; border-color: #1A3C4B; box-shadow: 0 0 0 2px rgba(26,60,75,.1); }
    .form-pie { display: flex; gap: 0.5rem; margin-top: 0.75rem; }
    .form-hint { font-size: 0.78rem; color: #64748b; margin-top: 0.25rem; }

    /* Modal */
    .modal-fondo { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 200; align-items: center; justify-content: center; padding: 1rem; }
    .modal-fondo.abierto { display: flex; }
    .modal-caja { background: white; border-radius: 10px; padding: 1.5rem; max-width: 480px; width: 100%; box-shadow: 0 20px 60px rgba(0,0,0,.25); }
    .modal-caja h3 { font-family: 'Trebuchet MS', Trebuchet, sans-serif; font-size: 1rem; color: #1e293b; margin-bottom: 1rem; }
    .modal-footer { display: flex; gap: 0.75rem; justify-content: flex-end; margin-top: 1rem; }

    /* Misc */
    .cargando { text-align: center; color: #94a3b8; padding: 3rem; font-style: italic; }
    .vacio    { text-align: center; color: #94a3b8; padding: 3rem; }
  </style>
</head>
<body>

<nav class="navbar">
  <a href="/panel/agenda.html">
    <img src="/assets/Logo%20mvla%202024%20%201%20color%20h.jpg"
         alt="Municipalidad Villa La Angostura" class="nav-logo">
  </a>
  <div class="nav-links">
    <a href="/panel/agenda.html">Agenda</a>
    <a href="/panel/presencial.html">Presencial</a>
    <a href="/panel/bloqueos.html">Bloqueos</a>
    <a href="/panel/auditoria.html"       id="nav-auditoria"  style="display:none">Auditoría</a>
    <a href="/panel/dashboard.html"       id="nav-dashboard"  style="display:none">Dashboard</a>
    <a href="/panel/usuarios.html"        class="activo">Usuarios</a>
    <a href="/panel/servicios-admin.html" id="nav-servicios"  style="display:none">Servicios</a>
  </div>
  <div class="nav-user">
    <span id="nav-nombre"></span>
    <button class="btn-logout" onclick="cerrarSesion()">Salir</button>
  </div>
</nav>

<div class="container">

  <h1>Gestión de usuarios</h1>

  <!-- Lista de usuarios -->
  <div class="card">
    <div class="card-titulo">
      <span>Usuarios del panel</span>
      <button class="btn btn-ghost btn-sm" onclick="cargarUsuarios()">↻ Actualizar</button>
    </div>
    <div class="alerta alerta-error" id="error-lista"></div>
    <div class="alerta alerta-ok"    id="ok-lista"></div>
    <div class="tabla-wrapper">
      <table>
        <thead>
          <tr>
            <th>Nombre</th>
            <th>Email</th>
            <th>Rol</th>
            <th>Área(s)</th>
            <th>Estado</th>
            <th>Último acceso</th>
            <th>Acciones</th>
          </tr>
        </thead>
        <tbody id="tbody-usuarios">
          <tr><td colspan="7" class="cargando">Cargando usuarios...</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <!-- Formulario nuevo usuario -->
  <div class="card" id="card-nuevo-usuario">
    <div class="card-titulo">Nuevo usuario</div>
    <div class="alerta alerta-error" id="error-form"></div>
    <div class="form-grid">
      <div class="form-grupo">
        <label for="nuevo-nombre">Nombre completo <span style="color:#dc2626">*</span></label>
        <input type="text" id="nuevo-nombre" placeholder="Ej: Sofía Romero">
      </div>
      <div class="form-grupo">
        <label for="nuevo-email">Email (se usa para iniciar sesión) <span style="color:#dc2626">*</span></label>
        <input type="email" id="nuevo-email" placeholder="ejemplo@municipio.gov.ar">
      </div>
      <div class="form-grupo">
        <label for="nuevo-password">Contraseña temporal <span style="color:#dc2626">*</span></label>
        <input type="password" id="nuevo-password" placeholder="Mínimo 6 caracteres">
        <span class="form-hint">El usuario deberá cambiarla al primer acceso.</span>
      </div>
      <div class="form-grupo">
        <label for="nuevo-area">Área <span style="color:#dc2626">*</span></label>
        <select id="nuevo-area">
          <option value="">— Seleccioná un área —</option>
        </select>
      </div>
      <div class="form-grupo">
        <label for="nuevo-rol">Rol <span style="color:#dc2626">*</span></label>
        <select id="nuevo-rol">
          <option value="">— Seleccioná un rol —</option>
          <option value="operador">Operador</option>
          <option value="encargado">Encargado</option>
          <!-- sistemas: solo visible para el rol sistemas -->
        </select>
      </div>
    </div>
    <div class="form-pie">
      <button class="btn btn-primary" onclick="crearUsuario()">Crear usuario</button>
    </div>
  </div>

</div>

<!-- Modal de edición -->
<div class="modal-fondo" id="modal-fondo">
  <div class="modal-caja">
    <h3>Editar usuario</h3>
    <div class="alerta alerta-error" id="error-modal"></div>
    <div class="form-grid">
      <div class="form-grupo">
        <label for="edit-nombre">Nombre completo</label>
        <input type="text" id="edit-nombre">
      </div>
      <div class="form-grupo">
        <label for="edit-rol">Rol</label>
        <select id="edit-rol">
          <option value="operador">Operador</option>
          <option value="encargado">Encargado</option>
          <!-- sistemas: se agrega dinámicamente si el usuario logueado es sistemas -->
        </select>
      </div>
      <div class="form-grupo">
        <label for="edit-activo">Estado</label>
        <select id="edit-activo">
          <option value="1">Activo</option>
          <option value="0">Inactivo</option>
        </select>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-ghost" onclick="cerrarModal()">Cancelar</button>
      <button class="btn btn-primary" onclick="guardarEdicion()">Guardar cambios</button>
    </div>
  </div>
</div>

<script>
// ─── Auth ──────────────────────────────────────────────────────────────────
function getToken() {
  const t = sessionStorage.getItem('panel_token');
  if (!t) { window.location.href = '/panel/login.html'; return null; }
  return t;
}
function getUsuario() { return JSON.parse(sessionStorage.getItem('panel_usuario') || '{}'); }
async function apiFetch(url, opts = {}) {
  const token = getToken();
  if (!token) return null;
  const res = await fetch(url, {
    ...opts,
    headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${token}`, ...opts.headers },
  });
  if (res.status === 401) { sessionStorage.clear(); window.location.href = '/panel/login.html'; return null; }
  return res;
}
async function cerrarSesion() {
  try { await apiFetch('/panel/logout', { method: 'POST' }); } catch {}
  sessionStorage.clear(); window.location.href = '/panel/login.html';
}

// ─── Helpers ───────────────────────────────────────────────────────────────
function esc(s) { return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function mostrarAlerta(idError, idOk, tipo, msg) {
  const errEl = document.getElementById(idError);
  const okEl  = document.getElementById(idOk);
  if (errEl) errEl.classList.remove('visible');
  if (okEl)  okEl.classList.remove('visible');
  if (!msg) return;
  if (tipo === 'error') { if (errEl) { errEl.textContent = msg; errEl.classList.add('visible'); } }
  else { if (okEl) { okEl.textContent = msg; okEl.classList.add('visible'); setTimeout(() => okEl.classList.remove('visible'), 4000); } }
}

function mostrarAlertaModal(tipo, msg) {
  const el = document.getElementById('error-modal');
  if (!el) return;
  if (msg && tipo === 'error') { el.textContent = msg; el.classList.add('visible'); }
  else { el.classList.remove('visible'); }
}

function formatFecha(ts) {
  if (!ts) return '—';
  // El timestamp puede venir como "2026-06-09 18:00:00" o "2026-06-09T18:00:00Z"
  const s = String(ts).replace('T', ' ').split(' ')[0];
  const [y, m, d] = s.split('-');
  return `${d}/${m}/${y}`;
}

// Badge de rol en navbar (color diferenciado)
function rolBadgeHTML(rol) {
  const cfg = {
    operador:  { bg: '#1e40af', label: 'Operador' },
    encargado: { bg: '#166534', label: 'Encargado' },
    sistemas:  { bg: '#6b21a8', label: 'Sistemas' },
    directivo: { bg: '#374151', label: 'Solo lectura' },
  };
  const { bg, label } = cfg[rol] || { bg: '#374151', label: rol };
  return `<span class="badge-rol" style="background:${bg};color:white">${label}</span>`;
}

// Badge de rol en tabla de usuarios
function badgeRol(rol) {
  const cfg = {
    operador:  { bg: '#dbeafe', color: '#1e40af', label: 'Operador' },
    encargado: { bg: '#dcfce7', color: '#166534', label: 'Encargado' },
    sistemas:  { bg: '#f3e8ff', color: '#6b21a8', label: 'Sistemas' },
    directivo: { bg: '#f1f5f9', color: '#374151', label: 'Directivo' },
  };
  const { bg, color, label } = cfg[rol] || { bg: '#f1f5f9', color: '#374151', label: rol };
  return `<span class="badge" style="background:${bg};color:${color}">${esc(label)}</span>`;
}

// ─── Estado de edición ─────────────────────────────────────────────────────
let idEditando = null;

// ─── Cargar usuarios ───────────────────────────────────────────────────────
async function cargarUsuarios() {
  mostrarAlerta('error-lista', 'ok-lista', null, '');
  document.getElementById('tbody-usuarios').innerHTML =
    '<tr><td colspan="7" class="cargando">Cargando...</td></tr>';

  const res = await apiFetch('/panel/usuarios');
  if (!res) return;
  const data = await res.json();

  if (!res.ok) {
    mostrarAlerta('error-lista', 'ok-lista', 'error', data.error || 'Error al cargar usuarios.');
    return;
  }

  if (!data.length) {
    document.getElementById('tbody-usuarios').innerHTML =
      '<tr><td colspan="7" class="vacio">No hay usuarios en tu área.</td></tr>';
    return;
  }

  const usuario = getUsuario();

  document.getElementById('tbody-usuarios').innerHTML = data.map(u => {
    const areas     = (u.areas || []).map(a => esc(a.area_nombre)).join(', ') || '—';
    const esSistemas = u.rol === 'sistemas';
    // Directivo no puede editar. Encargado no puede editar usuarios sistemas.
    const puedeEditar = usuario.rol !== 'directivo' && (usuario.rol === 'sistemas' || !esSistemas);

    return `<tr>
      <td style="font-weight:500">${esc(u.nombre)}</td>
      <td style="color:#64748b">${esc(u.email)}</td>
      <td>${badgeRol(u.rol)}</td>
      <td style="color:#64748b;font-size:.8rem">${areas}</td>
      <td><span class="badge ${u.activo ? 'badge-activo' : 'badge-inactivo'}">${u.activo ? 'Activo' : 'Inactivo'}</span></td>
      <td style="color:#64748b">${formatFecha(u.ultimo_acceso)}</td>
      <td class="td-acciones">
        ${puedeEditar
          ? `<button class="btn btn-ghost btn-sm" onclick="abrirModal(${u.id}, '${esc(u.nombre)}', '${esc(u.rol)}', ${u.activo ? 1 : 0})">Editar</button>`
          : '<span style="color:#94a3b8;font-size:.78rem">Sin permiso</span>'}
      </td>
    </tr>`;
  }).join('');
}

// ─── Cargar áreas para el select ──────────────────────────────────────────
async function cargarAreas() {
  // Reusar el endpoint de operadores (que devuelve áreas del usuario)
  // pero necesitamos áreas, no operadores. Usamos /panel/servicios para obtener area_id.
  // Como no hay endpoint de áreas, usamos una consulta inteligente:
  // el endpoint /panel/servicios devuelve area_id en cada servicio.
  const res = await apiFetch('/panel/servicios');
  if (!res || !res.ok) return;
  const servicios = await res.json();

  const areas = {};
  servicios.forEach(s => { if (s.area_id) areas[s.area_id] = s.nombre; });

  const select = document.getElementById('nuevo-area');
  select.innerHTML = '<option value="">— Seleccioná un área —</option>';
  Object.entries(areas).forEach(([id]) => {
    // Para el nombre del área usamos lo que sabemos del servicio — pero necesitamos el nombre del área.
    // Como el endpoint de servicios no devuelve area_nombre, pedimos a servicios/admin.
    // Si falla, al menos mostramos el ID.
  });

  // Usar el endpoint admin que sí devuelve area_nombre
  const resAdmin = await apiFetch('/panel/servicios/admin');
  if (!resAdmin || !resAdmin.ok) return;
  const serviciosAdmin = await resAdmin.json();

  const areasMap = {};
  serviciosAdmin.forEach(s => { areasMap[s.area_id] = s.area_nombre; });

  select.innerHTML = '<option value="">— Seleccioná un área —</option>';
  Object.entries(areasMap).forEach(([id, nombre]) => {
    const opt = document.createElement('option');
    opt.value = id; opt.textContent = nombre;
    select.appendChild(opt);
  });
}

// ─── Crear usuario ─────────────────────────────────────────────────────────
async function crearUsuario() {
  mostrarAlerta('error-form', null, null, '');
  const nombre   = document.getElementById('nuevo-nombre').value.trim();
  const email    = document.getElementById('nuevo-email').value.trim();
  const password = document.getElementById('nuevo-password').value;
  const area_id  = document.getElementById('nuevo-area').value;
  const rol      = document.getElementById('nuevo-rol').value;

  if (!nombre || !email || !password || !area_id || !rol) {
    mostrarAlerta('error-form', null, 'error', 'Completá todos los campos obligatorios.');
    return;
  }
  if (password.length < 6) {
    mostrarAlerta('error-form', null, 'error', 'La contraseña debe tener al menos 6 caracteres.');
    return;
  }

  const res = await apiFetch('/panel/usuarios', {
    method: 'POST',
    body: JSON.stringify({ nombre, email, password, area_id, rol }),
  });
  if (!res) return;
  const data = await res.json();

  if (!res.ok) {
    mostrarAlerta('error-form', null, 'error', data.error || 'Error al crear el usuario.');
    return;
  }

  // Limpiar formulario
  document.getElementById('nuevo-nombre').value   = '';
  document.getElementById('nuevo-email').value    = '';
  document.getElementById('nuevo-password').value = '';
  document.getElementById('nuevo-area').value     = '';
  document.getElementById('nuevo-rol').value      = '';

  mostrarAlerta('error-lista', 'ok-lista', 'ok', 'Usuario creado correctamente.');
  cargarUsuarios();
}

// ─── Modal de edición ──────────────────────────────────────────────────────
function abrirModal(id, nombre, rol, activo) {
  idEditando = id;
  document.getElementById('edit-nombre').value = nombre;
  document.getElementById('edit-rol').value    = rol;
  document.getElementById('edit-activo').value = activo;
  mostrarAlertaModal(null, '');
  document.getElementById('modal-fondo').classList.add('abierto');
}

function cerrarModal() {
  document.getElementById('modal-fondo').classList.remove('abierto');
  idEditando = null;
}

async function guardarEdicion() {
  if (!idEditando) return;
  mostrarAlertaModal(null, '');

  const nombre = document.getElementById('edit-nombre').value.trim();
  const rol    = document.getElementById('edit-rol').value;
  const activo = document.getElementById('edit-activo').value === '1';

  if (!nombre) { mostrarAlertaModal('error', 'El nombre no puede estar vacío.'); return; }

  const res = await apiFetch(`/panel/usuarios/${idEditando}`, {
    method: 'PATCH',
    body: JSON.stringify({ nombre, rol, activo }),
  });
  if (!res) return;
  const data = await res.json();

  if (!res.ok) {
    mostrarAlertaModal('error', data.error || 'Error al guardar cambios.');
    return;
  }

  cerrarModal();
  mostrarAlerta('error-lista', 'ok-lista', 'ok', 'Usuario actualizado correctamente.');
  cargarUsuarios();
}

// ─── Init ──────────────────────────────────────────────────────────────────
(async function init() {
  const token = getToken();
  if (!token) return;

  const usuario = getUsuario();

  if (!['encargado', 'sistemas', 'directivo'].includes(usuario.rol)) {
    window.location.href = '/panel/agenda.html';
    return;
  }

  const nombreEl = document.getElementById('nav-nombre');
  nombreEl.innerHTML = esc(usuario.nombre) + ' ' + rolBadgeHTML(usuario.rol);

  ['nav-auditoria', 'nav-dashboard', 'nav-servicios'].forEach(id => {
    const el = document.getElementById(id);
    if (el) el.style.display = '';
  });

  // Directivo = solo lectura: ocultar el formulario de nuevo usuario
  if (usuario.rol === 'directivo') {
    document.getElementById('card-nuevo-usuario').style.display = 'none';
  }

  // Si el usuario logueado es sistemas, agregar la opción "sistemas" al select de rol
  if (usuario.rol === 'sistemas') {
    const selNuevo = document.getElementById('nuevo-rol');
    const optSist  = document.createElement('option');
    optSist.value = 'sistemas'; optSist.textContent = 'Sistemas';
    selNuevo.appendChild(optSist);

    const selEdit = document.getElementById('edit-rol');
    const optSist2 = document.createElement('option');
    optSist2.value = 'sistemas'; optSist2.textContent = 'Sistemas';
    selEdit.appendChild(optSist2);
  }

  document.getElementById('modal-fondo').addEventListener('click', e => {
    if (e.target === document.getElementById('modal-fondo')) cerrarModal();
  });

  await Promise.all([cargarUsuarios(), cargarAreas()]);
})();
</script>
</body>
</html>
