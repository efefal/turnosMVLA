<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Auditoría — Panel MVLA</title>
  <link rel="icon" type="image/png" href="/assets/escudo_vla_web.png">
  <link rel="stylesheet" href="/assets/design-tokens.css">
  <style>
    /* ══════════════════════════════════════════════════════════════
       auditoria.html — estilos locales (design system C+)
       Todos los colores vienen de design-tokens.css.
    ══════════════════════════════════════════════════════════════ */

    /* ── Layout shell ─────────────────────────────────────────── */
    .app-shell    { display: flex; height: 100vh; overflow: hidden; }
    .main-content { flex: 1; overflow-y: auto; background: var(--bg-2); }
    .page-inner   { max-width: 1200px; margin: 0 auto; padding: 2rem 1.5rem; }

    /* ── Header de página ────────────────────────────────────────── */
    .page-supertitle {
      font-size: var(--text-xs);
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--teal);
      margin-bottom: 0.2rem;
    }
    .page-title {
      font-size: var(--text-xl);
      font-weight: 800;
      color: var(--text-1);
      margin-bottom: 1.5rem;
    }

    /* ── Sidebar (copiado de dashboard.html) ─────────────────────── */
    .sidebar { width: var(--sidebar-width); background: var(--bg-1); border-right: 1px solid var(--border); display: flex; flex-direction: column; flex-shrink: 0; overflow-y: auto; }
    .sidebar-header { display: flex; align-items: center; gap: var(--gap-sm); padding: 14px 12px 10px; border-bottom: 1px solid var(--border); }
    .sidebar-logo { width: 36px; height: 36px; border-radius: var(--radius-xl); background: var(--teal-dim); color: var(--teal); display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 800; flex-shrink: 0; letter-spacing: 0.04em; }
    .sidebar-muni { font-size: 8.5px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-3); }
    .sidebar-ciudad { font-size: 12.5px; font-weight: 700; color: var(--text-1); }
    .sidebar-user-card { margin: 8px; padding: 7px 9px; border-radius: var(--radius-md); display: flex; align-items: center; gap: var(--gap-sm); }
    .sidebar-avatar { width: 28px; height: 28px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: var(--text-xs); font-weight: 700; flex-shrink: 0; }
    .nav-section-label { font-size: 8.5px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.1em; color: var(--text-3); padding: 10px 12px 4px; }
    .sidebar-nav { padding: 0 6px; flex: 1; }
    .sidebar-footer { border-top: 1px solid var(--border); padding: 10px 12px; }
    .btn-logout-sidebar { background: transparent; border: 1px solid var(--border); border-radius: var(--radius-md); color: var(--text-2); padding: 5px 10px; font-family: var(--font-ui); font-size: var(--text-sm); cursor: pointer; width: 100%; transition: var(--transition-fast); }
    .btn-logout-sidebar:hover { background: var(--bg-4); border-color: var(--border-hi); color: var(--text-1); }

    /* ── Card ─────────────────────────────────────────────────── */
    .card {
      background: var(--bg-3);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 1rem 1.25rem;
      margin-bottom: 1rem;
    }

    /* ── Selector de área B9 ─────────────────────────────────────── */
    .area-selector { display: none; margin-bottom: 1rem; }
    .area-selector.visible { display: block; }
    .area-selector-titulo {
      font-size: var(--text-xs);
      font-weight: 600;
      color: var(--text-3);
      margin-bottom: 0.4rem;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }
    .area-chips { display: flex; flex-wrap: wrap; gap: 0.4rem; }
    .area-chip {
      display: inline-flex;
      align-items: center;
      gap: 0.3rem;
      padding: 0.3rem 0.7rem;
      border: 1px solid var(--border);
      border-radius: 99px;
      cursor: pointer;
      font-size: var(--text-sm);
      font-weight: 500;
      color: var(--text-2);
      background: transparent;
      transition: var(--transition-fast);
      user-select: none;
    }
    .area-chip:hover  { border-color: var(--border-hi); color: var(--text-1); }
    .area-chip.activo { border-color: var(--teal-mid); background: var(--teal-dim); color: var(--teal); font-weight: 600; }

    /* ── Filtros ─────────────────────────────────────────────────── */
    .filtros { display: flex; gap: 0.75rem; flex-wrap: wrap; align-items: flex-end; }
    .filtro-grupo { display: flex; flex-direction: column; gap: 0.3rem; }
    .filtro-grupo label {
      font-size: var(--text-xs);
      font-weight: 500;
      color: var(--text-2);
    }
    input[type="date"] {
      padding: 0.4rem 0.6rem;
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      font-size: var(--text-base);
      font-family: var(--font-ui);
      background: var(--bg-4);
      color: var(--text-1);
      cursor: pointer;
      transition: var(--transition-fast);
    }
    input[type="date"]:focus { outline: none; border-color: var(--border-hi); }

    /* ── Paneles de checkboxes B7 ────────────────────────────────── */
    .filtro-panel { position: relative; }
    .filtro-panel-btn {
      padding: 0.4rem 0.7rem;
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      font-size: var(--text-base);
      font-family: var(--font-ui);
      background: var(--bg-4);
      color: var(--text-2);
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 0.4rem;
      min-width: 120px;
      transition: var(--transition-fast);
    }
    .filtro-panel-btn:focus { outline: none; border-color: var(--border-hi); }
    .filtro-panel-btn:hover { border-color: var(--border-hi); color: var(--text-1); }
    .filtro-panel-btn.activo { border-color: var(--border-hi); background: var(--teal-dim); color: var(--teal); }
    .filtro-panel-caret { font-size: 0.6rem; margin-left: auto; }
    .filtro-panel-dropdown {
      display: none;
      position: absolute;
      top: calc(100% + 4px);
      left: 0;
      z-index: 100;
      background: var(--bg-3);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      min-width: 180px;
      max-height: 240px;
      overflow-y: auto;
      box-shadow: 0 4px 16px rgba(0,0,0,.35);
      padding: 0.25rem 0;
    }
    .filtro-panel-dropdown.abierto { display: block; }
    .check-item {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.35rem 0.75rem;
      cursor: pointer;
      font-size: var(--text-base);
      color: var(--text-1);
    }
    .check-item:hover { background: var(--bg-4); }
    .check-item input[type="checkbox"] { accent-color: var(--teal); cursor: pointer; }
    .check-todos { border-bottom: 1px solid var(--border); font-weight: 600; }

    /* ── Alerta ──────────────────────────────────────────────────── */
    .alerta {
      padding: 0.7rem 1rem;
      border-radius: var(--radius-md);
      font-size: var(--text-base);
      margin-bottom: 1rem;
      display: none;
    }
    .alerta.visible { display: block; }
    .alerta-error {
      background: var(--red-dim);
      border: 1px solid var(--red-mid);
      color: var(--red);
    }

    /* ── Tabla ───────────────────────────────────────────────────── */
    .tabla-wrapper { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; }
    th {
      background: var(--bg-1);
      color: var(--text-3);
      font-family: var(--font-ui);
      font-weight: 600;
      font-size: var(--text-xs);
      text-transform: uppercase;
      letter-spacing: 0.04em;
      padding: 0.7rem 1rem;
      border-bottom: 2px solid var(--border);
      text-align: left;
      white-space: nowrap;
    }
    td {
      padding: 0.75rem 1rem;
      border-bottom: 1px solid var(--border);
      vertical-align: top;
      font-size: var(--text-base);
      color: var(--text-1);
    }
    tr:last-child td { border-bottom: none; }
    tr:hover td { background: var(--bg-4); }
    .td-fecha   { white-space: nowrap; color: var(--text-2); }
    .td-detalle { max-width: 280px; word-break: break-word; color: var(--text-2); font-size: var(--text-sm); }
    .td-ref     { max-width: 160px; font-style: italic; color: var(--text-2); }

    /* ── Badges de acción ────────────────────────────────────────── */
    /* No se usan .audit-badge/.audit-* porque el JS genera .badge-accion.accion-* */
    /* con nombres en español. Ver §4 del plan para el análisis del mismatch.      */
    .badge-accion {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 20px;
      font-size: var(--text-xs);
      font-weight: 600;
      font-family: var(--font-ui);
    }
    .accion-crear       { color: var(--teal);   background: rgba(45,212,160,.18);  border: 1px solid rgba(45,212,160,.44);  }
    .accion-modificar   { color: var(--blue);   background: rgba(75,168,248,.18);  border: 1px solid rgba(75,168,248,.44);  }
    .accion-cancelar    { color: var(--red);    background: rgba(245,104,104,.18); border: 1px solid rgba(245,104,104,.44); }
    .accion-eliminar    { color: var(--red);    background: rgba(245,104,104,.18); border: 1px solid rgba(245,104,104,.44); }
    .accion-bloquear    { color: var(--amber);  background: rgba(245,165,42,.18);  border: 1px solid rgba(245,165,42,.44);  }
    .accion-desbloquear { color: var(--text-2); background: rgba(110,144,171,.18); border: 1px solid rgba(110,144,171,.44); }
    .accion-login       { color: var(--text-2); background: rgba(110,144,171,.18); border: 1px solid rgba(110,144,171,.44); }
    .accion-logout      { color: var(--text-2); background: rgba(110,144,171,.18); border: 1px solid rgba(110,144,171,.44); }

    /* ── Paginación ──────────────────────────────────────────────── */
    .paginacion {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.75rem 0 0;
      flex-wrap: wrap;
      gap: 0.5rem;
    }
    .pag-info { font-size: var(--text-base); color: var(--text-2); }
    .pag-botones { display: flex; gap: 0.4rem; }

    /* ── Carga y vacío ───────────────────────────────────────────── */
    .cargando { text-align: center; color: var(--text-3); padding: 3rem; font-style: italic; }
    .vacio    { text-align: center; color: var(--text-3); padding: 3rem; }

    /* ── Botón deshabilitado ─────────────────────────────────────── */
    .btn:disabled { opacity: 0.4; cursor: not-allowed; }
  </style>
</head>
<body>

<div class="app-shell">

  <!-- ── Sidebar ─────────────────────────────────────────────────────── -->
  <aside class="sidebar">

    <div class="sidebar-header">
      <div class="sidebar-logo"><img src="/assets/escudo_vla_web_color.png" alt="Municipalidad de Villa La Angostura" style="width: 100%; height: 100%; object-fit: contain;"></div>
      <div>
        <div class="sidebar-muni">Municipalidad</div>
        <div class="sidebar-ciudad">Villa La Angostura</div>
      </div>
    </div>

    <div class="sidebar-user-card">
      <div class="sidebar-avatar" id="sidebar-avatar"></div>
      <div>
        <span id="nav-nombre"></span>
      </div>
    </div>

    <nav class="sidebar-nav">
      <div class="nav-section-label">Calendario</div>
      <a href="/panel/agenda.html"     class="nav-item">Agenda</a>
      <a href="/panel/presencial.html" class="nav-item">Presencial</a>
      <a href="/panel/bloqueos.html"   class="nav-item">Bloqueos</a>

      <!-- Reportes — ocultos por defecto; init() los muestra según rol -->
      <div class="nav-section-label" id="label-reportes" style="display:none">Reportes</div>
      <a href="/panel/auditoria.html"  class="nav-item active">Auditoría</a>
      <a href="/panel/dashboard.html"  class="nav-item" id="nav-dashboard" style="display:none">Dashboard</a>

      <!-- Admin — ocultos por defecto; init() los muestra según rol -->
      <div class="nav-section-label" id="label-admin" style="display:none">Admin.</div>
      <a href="/panel/usuarios.html"        class="nav-item" id="nav-usuarios"  style="display:none">Usuarios</a>
      <a href="/panel/servicios-admin.html" class="nav-item" id="nav-servicios" style="display:none">Servicios</a>
      <a href="/panel/areas.html"           class="nav-item" id="nav-areas"     style="display:none">Áreas</a>
    </nav>

    <div class="sidebar-footer">
      <button class="btn-logout-sidebar" onclick="cerrarSesion()">Salir</button>
    </div>

  </aside>

  <!-- ── Contenido principal ─────────────────────────────────────────── -->
  <main class="main-content">
    <div class="page-inner">

      <div class="page-header">
        <p class="page-supertitle">Panel de gestión</p>
        <h1 class="page-title">Registro de auditoría</h1>
      </div>

      <!-- B9: Selector de área (visible solo si el usuario tiene acceso a más de un área) -->
      <div class="area-selector" id="area-selector">
        <div class="area-selector-titulo">Filtrar por área</div>
        <div class="area-chips" id="area-chips"></div>
      </div>

      <!-- Filtros -->
      <div class="card">
        <div class="filtros">
          <div class="filtro-grupo">
            <label>Desde</label>
            <input type="date" id="filtro-desde">
          </div>
          <div class="filtro-grupo">
            <label>Hasta</label>
            <input type="date" id="filtro-hasta">
          </div>

          <!-- B7: Panel de usuarios con checkboxes -->
          <div class="filtro-grupo">
            <label>Usuario</label>
            <div class="filtro-panel" id="panel-usuarios">
              <button class="filtro-panel-btn" onclick="togglePanel('panel-usuarios')">
                <span id="lbl-usuarios">Todos</span>
                <span class="filtro-panel-caret">▼</span>
              </button>
              <div class="filtro-panel-dropdown" id="drop-usuarios">
                <label class="check-item check-todos">
                  <input type="checkbox" id="chk-todos-usuarios" checked onchange="toggleTodos('usuarios')"> Todos
                </label>
                <div id="lista-usuarios"></div>
              </div>
            </div>
          </div>

          <!-- B7: Panel de acciones con checkboxes -->
          <div class="filtro-grupo">
            <label>Acción</label>
            <div class="filtro-panel" id="panel-acciones">
              <button class="filtro-panel-btn" onclick="togglePanel('panel-acciones')">
                <span id="lbl-acciones">Todas</span>
                <span class="filtro-panel-caret">▼</span>
              </button>
              <div class="filtro-panel-dropdown" id="drop-acciones">
                <label class="check-item check-todos">
                  <input type="checkbox" id="chk-todos-acciones" checked onchange="toggleTodos('acciones')"> Todas
                </label>
                <div id="lista-acciones">
                  <!-- se rellena en JS -->
                </div>
              </div>
            </div>
          </div>

          <!-- B7: Panel de entidades con checkboxes -->
          <div class="filtro-grupo">
            <label>Entidad</label>
            <div class="filtro-panel" id="panel-entidades">
              <button class="filtro-panel-btn" onclick="togglePanel('panel-entidades')">
                <span id="lbl-entidades">Todas</span>
                <span class="filtro-panel-caret">▼</span>
              </button>
              <div class="filtro-panel-dropdown" id="drop-entidades">
                <label class="check-item check-todos">
                  <input type="checkbox" id="chk-todos-entidades" checked onchange="toggleTodos('entidades')"> Todas
                </label>
                <div id="lista-entidades">
                  <!-- se rellena en JS -->
                </div>
              </div>
            </div>
          </div>

          <button class="btn btn-primary"   onclick="buscar()">Buscar</button>
          <button class="btn btn-secondary" onclick="limpiarFiltros()">Limpiar</button>
        </div>
      </div>

      <div class="alerta alerta-error" id="alerta-error"></div>

      <!-- Tabla de registros -->
      <div class="card">
        <div class="tabla-wrapper">
          <table>
            <thead>
              <tr>
                <th>Fecha/hora</th>
                <th>Usuario</th>
                <th>Acción</th>
                <th>Entidad</th>
                <th>Referencia</th>
                <th>Canal</th>
                <th>Detalle</th>
              </tr>
            </thead>
            <tbody id="tbody"></tbody>
          </table>
          <div id="estado-carga" class="cargando">Cargando registros...</div>
        </div>
        <div class="paginacion">
          <span class="pag-info" id="pag-info"></span>
          <div class="pag-botones">
            <button class="btn btn-secondary" id="btn-anterior" onclick="irPagina(paginaActual - 1)" disabled>◀ Anterior</button>
            <button class="btn btn-secondary" id="btn-siguiente" onclick="irPagina(paginaActual + 1)" disabled>Siguiente ▶</button>
          </div>
        </div>
      </div>

    </div><!-- .page-inner -->
  </main>

</div><!-- .app-shell -->

<script>
// ─── Auth ──────────────────────────────────────────────────────────────────
function getToken() {
  const t = sessionStorage.getItem('panel_token');
  if (!t) { window.location.href = '/panel/login.html'; return null; }
  return t;
}
function getUsuario() { return JSON.parse(sessionStorage.getItem('panel_usuario') || '{}'); }
async function apiFetch(url, opts = {}) {
  const token = getToken();
  if (!token) return null;
  const res = await fetch(url, {
    ...opts,
    headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${token}`, ...opts.headers },
  });
  if (res.status === 401) { sessionStorage.clear(); window.location.href = '/panel/login.html'; return null; }
  return res;
}
async function cerrarSesion() {
  try { await apiFetch('/panel/logout', { method: 'POST' }); } catch {}
  sessionStorage.clear(); window.location.href = '/panel/login.html';
}

// ─── Helpers ───────────────────────────────────────────────────────────────
function esc(s) { return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function rolBadgeHTML(rol) {
  const cfg = {
    operador:  { cls: 'role-operador',  label: 'Operador'     },
    encargado: { cls: 'role-encargado', label: 'Encargado'    },
    sistemas:  { cls: 'role-sistemas',  label: 'Sistemas'     },
    directivo: { cls: 'role-directivo', label: 'Solo lectura' },
  };
  const { cls, label } = cfg[rol] || { cls: 'role-admin', label: rol };
  return `<span class="role-badge ${cls}">${label}</span>`;
}

function formatFecha(ts) {
  if (!ts) return '—';
  const [fecha, hora] = String(ts).split('T').length > 1 ? String(ts).split('T') : String(ts).split(' ');
  const [y, m, d] = fecha.split('-');
  return `${d}/${m}/${y} ${hora ? hora.substring(0, 5) : ''}`;
}

function badgeAccion(accion) {
  return `<span class="badge-accion accion-${esc(accion)}">${esc(accion)}</span>`;
}

function mostrarError(msg) {
  const el = document.getElementById('alerta-error');
  if (msg) { el.textContent = msg; el.classList.add('visible'); }
  else      { el.classList.remove('visible'); }
}

// ─── B9: Selector de área ─────────────────────────────────────────────────
let areasSeleccionadas = new Set(); // IDs de áreas activas (vacío = todas)

function inicializarSelectorArea(areas) {
  const usuario = getUsuario();
  const tieneMultiArea = areas.length > 1 ||
    usuario.rol === 'sistemas' || usuario.rol === 'directivo';

  if (!tieneMultiArea) return; // operador/encargado de un área: no mostrar

  const contenedor = document.getElementById('area-selector');
  const chipsEl    = document.getElementById('area-chips');
  contenedor.classList.add('visible');

  // Chip "Todas"
  const chipTodas = document.createElement('span');
  chipTodas.className  = 'area-chip activo';
  chipTodas.dataset.id = 'todas';
  chipTodas.textContent = 'Todas las áreas';
  chipTodas.onclick = () => seleccionarArea('todas', areas);
  chipsEl.appendChild(chipTodas);

  areas.forEach(a => {
    const chip = document.createElement('span');
    chip.className   = 'area-chip';
    chip.dataset.id  = a.id;
    chip.textContent = a.nombre;
    chip.onclick = () => seleccionarArea(a.id, areas);
    chipsEl.appendChild(chip);
  });
}

function seleccionarArea(id, areas) {
  const chips = document.querySelectorAll('.area-chip');
  if (id === 'todas') {
    areasSeleccionadas.clear();
    chips.forEach(c => c.classList.toggle('activo', c.dataset.id === 'todas'));
  } else {
    const chipTodas = document.querySelector('.area-chip[data-id="todas"]');
    chipTodas.classList.remove('activo');
    const chip = document.querySelector(`.area-chip[data-id="${id}"]`);
    if (areasSeleccionadas.has(id)) {
      areasSeleccionadas.delete(id);
      chip.classList.remove('activo');
      if (areasSeleccionadas.size === 0) {
        areasSeleccionadas.clear();
        chipTodas.classList.add('activo');
      }
    } else {
      areasSeleccionadas.add(id);
      chip.classList.add('activo');
    }
  }
  cargar(1);
}

// ─── B7: Paneles de checkboxes ────────────────────────────────────────────

// Cierra todos los paneles cuando se hace clic fuera
document.addEventListener('click', e => {
  if (!e.target.closest('.filtro-panel')) {
    document.querySelectorAll('.filtro-panel-dropdown').forEach(d => d.classList.remove('abierto'));
  }
});

function togglePanel(panelId) {
  const panel = document.getElementById(panelId);
  const drop  = panel.querySelector('.filtro-panel-dropdown');
  const abierto = drop.classList.contains('abierto');
  // Cerrar todos los demás
  document.querySelectorAll('.filtro-panel-dropdown').forEach(d => d.classList.remove('abierto'));
  if (!abierto) drop.classList.add('abierto');
}

// Tilda/destilda todos los checkboxes de un panel
function toggleTodos(tipo) {
  const todosChk = document.getElementById(`chk-todos-${tipo}`);
  const items = document.querySelectorAll(`#lista-${tipo} input[type="checkbox"]`);
  items.forEach(i => { i.checked = todosChk.checked; });
  actualizarEtiqueta(tipo);
}

// Cuando cambia un checkbox individual: actualizar el "Todos"
function onCheckChange(tipo) {
  const items  = Array.from(document.querySelectorAll(`#lista-${tipo} input[type="checkbox"]`));
  const todos  = items.every(i => i.checked);
  const ninguno = items.every(i => !i.checked);
  document.getElementById(`chk-todos-${tipo}`).checked = todos;
  actualizarEtiqueta(tipo);
}

// Actualiza el texto del botón del panel según la selección actual
function actualizarEtiqueta(tipo) {
  const items    = Array.from(document.querySelectorAll(`#lista-${tipo} input[type="checkbox"]`));
  const activos  = items.filter(i => i.checked);
  const etiqueta = {
    usuarios: { todos: 'Todos', uno: u => u, n: n => `${n} usuarios` },
    acciones: { todos: 'Todas', uno: u => u, n: n => `${n} acciones` },
    entidades: { todos: 'Todas', uno: u => u, n: n => `${n} entidades` },
  }[tipo];

  let texto;
  if (activos.length === 0 || activos.length === items.length) {
    texto = etiqueta.todos;
  } else if (activos.length === 1) {
    texto = etiqueta.uno(activos[0].dataset.label || activos[0].value);
  } else {
    texto = etiqueta.n(activos.length);
  }
  document.getElementById(`lbl-${tipo}`).textContent = texto;
  const btn = document.querySelector(`#panel-${tipo} .filtro-panel-btn`);
  btn.classList.toggle('activo', activos.length > 0 && activos.length < items.length);
}

// Obtiene los valores seleccionados de un panel (vacío = todos)
function getSeleccionados(tipo) {
  const items   = Array.from(document.querySelectorAll(`#lista-${tipo} input[type="checkbox"]`));
  const activos = items.filter(i => i.checked).map(i => i.value);
  // Si están todos o ninguno activos, no se filtra
  if (activos.length === 0 || activos.length === items.length) return [];
  return activos;
}

// Agrega un item de checkbox a un panel
function agregarCheckItem(listaId, value, label, checked = true) {
  const div   = document.getElementById(listaId);
  const lbl   = document.createElement('label');
  const tipo  = listaId.replace('lista-', '');
  lbl.className = 'check-item';
  lbl.innerHTML = `<input type="checkbox" value="${esc(value)}" data-label="${esc(label)}"
    ${checked ? 'checked' : ''} onchange="onCheckChange('${tipo}')"> ${esc(label)}`;
  div.appendChild(lbl);
}

// ─── Estado ────────────────────────────────────────────────────────────────
let paginaActual = 1;
let totalPaginas = 1;

// ─── Cargar registros ──────────────────────────────────────────────────────
async function cargar(pagina = 1) {
  paginaActual = pagina;
  mostrarError('');
  document.getElementById('tbody').innerHTML = '';
  document.getElementById('estado-carga').style.display = 'block';
  document.getElementById('estado-carga').textContent   = 'Cargando registros...';
  document.getElementById('pag-info').textContent = '';
  document.getElementById('btn-anterior').disabled  = true;
  document.getElementById('btn-siguiente').disabled = true;

  const desde    = document.getElementById('filtro-desde').value;
  const hasta    = document.getElementById('filtro-hasta').value;

  // B7: obtener arrays de los paneles de checkboxes
  const usuarios  = getSeleccionados('usuarios');
  const acciones  = getSeleccionados('acciones');
  const entidades = getSeleccionados('entidades');

  const params = new URLSearchParams({ pagina });
  if (desde) params.set('desde', desde);
  if (hasta) params.set('hasta', hasta);
  usuarios.forEach(v  => params.append('usuarios[]',  v));
  acciones.forEach(v  => params.append('acciones[]',  v));
  entidades.forEach(v => params.append('entidades[]', v));

  // B9: áreas seleccionadas
  areasSeleccionadas.forEach(id => params.append('areas[]', id));

  const res = await apiFetch(`/panel/auditoria?${params}`);
  if (!res) return;

  const data = await res.json();
  document.getElementById('estado-carga').style.display = 'none';

  if (!res.ok) { mostrarError(data.error || 'Error al cargar los registros.'); return; }

  totalPaginas = data.paginas || 1;

  if (!data.registros || data.registros.length === 0) {
    document.getElementById('tbody').innerHTML =
      '<tr><td colspan="7" class="vacio">No hay registros para los filtros aplicados.</td></tr>';
    document.getElementById('pag-info').textContent = '0 registros';
    return;
  }

  document.getElementById('tbody').innerHTML = data.registros.map(r => {
    let detalleStr = '—';
    if (r.detalle) {
      try {
        const d = typeof r.detalle === 'string' ? JSON.parse(r.detalle) : r.detalle;
        detalleStr = Object.entries(d)
          .filter(([, v]) => v !== null && v !== undefined && v !== '')
          .map(([k, v]) => `${k}: ${typeof v === 'object' ? JSON.stringify(v) : v}`)
          .join(' · ');
      } catch { detalleStr = String(r.detalle); }
    }

    // B6: mostrar descripcion legible en lugar del ID numérico
    const refText = r.descripcion
      ? esc(r.descripcion)
      : `<span style="color:#94a3b8">#${r.entidad_id}</span>`;

    return `<tr>
      <td class="td-fecha">${formatFecha(r.timestamp)}</td>
      <td>${r.usuario_nombre ? esc(r.usuario_nombre) : '<span style="color:#94a3b8">Sistema</span>'}</td>
      <td>${badgeAccion(r.accion)}</td>
      <td>${esc(r.entidad_tipo)}</td>
      <td class="td-ref">${refText}</td>
      <td style="color:#64748b">${esc(r.canal)}</td>
      <td class="td-detalle">${esc(detalleStr)}</td>
    </tr>`;
  }).join('');

  const d2 = (paginaActual - 1) * 50 + 1;
  const h2 = Math.min(paginaActual * 50, data.total);
  document.getElementById('pag-info').textContent =
    `Mostrando ${d2}–${h2} de ${data.total} registros (pág. ${paginaActual} / ${totalPaginas})`;

  document.getElementById('btn-anterior').disabled  = paginaActual <= 1;
  document.getElementById('btn-siguiente').disabled = paginaActual >= totalPaginas;
}

function buscar() { cargar(1); }
function irPagina(n) { if (n >= 1 && n <= totalPaginas) cargar(n); }

function limpiarFiltros() {
  document.getElementById('filtro-desde').value = '';
  document.getElementById('filtro-hasta').value = '';
  // Resetear todos los panels: tildar todos los checkboxes
  ['usuarios', 'acciones', 'entidades'].forEach(tipo => {
    document.querySelectorAll(`#lista-${tipo} input, #chk-todos-${tipo}`).forEach(i => i.checked = true);
    actualizarEtiqueta(tipo);
  });
  cargar(1);
}

// ─── Cargar dropdown de usuarios ──────────────────────────────────────────
async function cargarUsuarios() {
  const res = await apiFetch('/panel/auditoria/usuarios');
  if (!res || !res.ok) return;
  const data = await res.json();
  data.forEach(u => agregarCheckItem('lista-usuarios', u.id, u.nombre));
  actualizarEtiqueta('usuarios');
}

// ─── Rellenar acciones y entidades (listas estáticas) ────────────────────
function rellenarAcciones() {
  const acciones = ['crear','modificar','cancelar','eliminar','bloquear','desbloquear','login','logout'];
  const labels   = { crear:'Crear', modificar:'Modificar', cancelar:'Cancelar', eliminar:'Eliminar',
                     bloquear:'Bloquear', desbloquear:'Desbloquear', login:'Login', logout:'Logout' };
  acciones.forEach(a => agregarCheckItem('lista-acciones', a, labels[a] || a));
  actualizarEtiqueta('acciones');
}

function rellenarEntidades() {
  const entidades = ['turno','servicio','bloqueo','usuario','area','feriado','horario'];
  const labels    = { turno:'Turno', servicio:'Servicio', bloqueo:'Bloqueo', usuario:'Usuario',
                      area:'Área', feriado:'Feriado', horario:'Horario' };
  entidades.forEach(e => agregarCheckItem('lista-entidades', e, labels[e] || e));
  actualizarEtiqueta('entidades');
}

// ─── Init ──────────────────────────────────────────────────────────────────
(async function init() {
  const token = getToken();
  if (!token) return;

  const usuario = getUsuario();

  if (!['encargado', 'sistemas', 'directivo'].includes(usuario.rol)) {
    window.location.href = '/panel/agenda.html';
    return;
  }

  const nombreEl = document.getElementById('nav-nombre');
  nombreEl.innerHTML = esc(usuario.nombre) + ' ' + rolBadgeHTML(usuario.rol);

  // Sidebar avatar: iniciales + color según rol (copiado de dashboard.html)
  const avatarEl = document.getElementById('sidebar-avatar');
  if (avatarEl) {
    const partes    = (usuario.nombre || '').trim().split(/\s+/);
    const iniciales = partes.slice(0, 2).map(p => p[0] || '').join('').toUpperCase() || '?';
    const avatarCfg = {
      encargado: { bg: 'var(--teal-mid)',  color: 'var(--teal)'  },
      operador:  { bg: 'var(--blue-mid)',  color: 'var(--blue)'  },
      sistemas:  { bg: 'var(--amber-mid)', color: 'var(--amber)' },
      directivo: { bg: 'var(--amber-mid)', color: 'var(--amber)' },
    };
    const ac = avatarCfg[usuario.rol] || avatarCfg.operador;
    avatarEl.textContent      = iniciales;
    avatarEl.style.background = ac.bg;
    avatarEl.style.color      = ac.color;
  }

  // Labels de sección del sidebar
  const lRep = document.getElementById('label-reportes');
  if (lRep) lRep.style.display = '';
  const lAdm = document.getElementById('label-admin');
  if (lAdm) lAdm.style.display = '';

  ['nav-dashboard', 'nav-usuarios', 'nav-servicios'].forEach(id => {
    const el = document.getElementById(id);
    if (el) el.style.display = '';
  });

  // Áreas: exclusivo rol sistemas
  if (usuario.rol === 'sistemas') {
    const elArea = document.getElementById('nav-areas');
    if (elArea) elArea.style.display = '';
  }

  // Fecha por defecto: mes actual
  const hoy   = new Date();
  const inicio = new Date(hoy.getFullYear(), hoy.getMonth(), 1);
  document.getElementById('filtro-hasta').value = hoy.toISOString().substring(0, 10);
  document.getElementById('filtro-desde').value = inicio.toISOString().substring(0, 10);

  rellenarAcciones();
  rellenarEntidades();

  // B9: cargar áreas disponibles para el selector
  const resAreas = await apiFetch('/panel/areas');
  if (resAreas && resAreas.ok) {
    const areas = await resAreas.json();
    inicializarSelectorArea(areas);
  }

  await Promise.all([cargarUsuarios(), cargar(1)]);
})();
</script>
