<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cambiar contraseña — Panel MVLA</title>
  <link rel="icon" type="image/png" href="/assets/escudo_vla_web.png">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
      background: #1A3C4B;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }
    .card {
      background: white;
      border-radius: 12px;
      box-shadow: 0 20px 60px rgba(0,0,0,.35);
      padding: 2.5rem;
      width: 100%;
      max-width: 420px;
    }
    .encabezado {
      text-align: center;
      margin-bottom: 1.75rem;
      padding-bottom: 1.5rem;
      border-bottom: 1px solid #f1f5f9;
    }
    .encabezado img {
      max-width: 200px;
      height: auto;
      display: block;
      margin: 0 auto 1rem;
    }
    .encabezado h1 {
      font-family: 'Trebuchet MS', Trebuchet, sans-serif;
      font-size: 1rem;
      font-weight: 700;
      color: #1A3C4B;
    }
    .aviso {
      background: #fefce8;
      border: 1px solid #fde047;
      color: #854d0e;
      padding: 0.75rem 1rem;
      border-radius: 7px;
      font-size: 0.85rem;
      margin-bottom: 1.25rem;
    }
    .form-grupo { margin-bottom: 1.1rem; }
    label {
      display: block;
      font-size: 0.85rem;
      font-weight: 500;
      color: #374151;
      margin-bottom: 0.4rem;
    }
    input {
      width: 100%;
      padding: 0.6rem 0.8rem;
      border: 1px solid #d1d5db;
      border-radius: 7px;
      font-size: 0.9rem;
      font-family: inherit;
      transition: border-color 0.15s, box-shadow 0.15s;
    }
    input:focus {
      outline: none;
      border-color: #1A3C4B;
      box-shadow: 0 0 0 3px rgba(26,60,75,.12);
    }
    .error {
      background: #fef2f2;
      border: 1px solid #fecaca;
      color: #991b1b;
      padding: 0.7rem 0.9rem;
      border-radius: 7px;
      font-size: 0.85rem;
      margin-bottom: 1rem;
      display: none;
    }
    .btn-guardar {
      width: 100%;
      padding: 0.65rem;
      background: #1A3C4B;
      color: white;
      border: none;
      border-radius: 7px;
      font-size: 0.95rem;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      transition: opacity 0.15s;
    }
    .btn-guardar:hover:not(:disabled) { opacity: 0.88; }
    .btn-guardar:disabled { opacity: 0.5; cursor: not-allowed; }
    .pie {
      text-align: center;
      margin-top: 1.25rem;
      font-size: 0.78rem;
      color: #94a3b8;
    }
  </style>
</head>
<body>

<div class="card">
  <div class="encabezado">
    <img src="/assets/Logo%20mvla%202024%20%201%20color%20h.jpg"
         alt="Municipalidad de Villa La Angostura">
    <h1>Cambiar contraseña</h1>
  </div>

  <!-- Aviso visible solo cuando el cambio es obligatorio (primer login con clave temporal) -->
  <div class="aviso" id="aviso-obligatorio" style="display:none">
    Tu cuenta tiene una contraseña temporal. Debés establecer una nueva contraseña
    antes de continuar.
  </div>

  <form id="form-cambio">
    <div class="form-grupo">
      <label for="clave-nueva">Nueva contraseña</label>
      <input type="password" id="clave-nueva" autocomplete="new-password"
             placeholder="Mínimo 6 caracteres" required>
    </div>
    <div class="form-grupo">
      <label for="clave-confirmar">Confirmar contraseña</label>
      <input type="password" id="clave-confirmar" autocomplete="new-password"
             placeholder="Repetí la nueva contraseña" required>
    </div>

    <div class="error" id="error"></div>

    <button type="submit" class="btn-guardar" id="btn-submit">
      Guardar contraseña
    </button>
  </form>

  <p class="pie">Municipalidad de Villa La Angostura — Sistema de Turnos</p>
</div>

<script>
  // Verificar que haya sesión activa (token generado en el login)
  const token = sessionStorage.getItem('panel_token');
  if (!token) {
    window.location.href = '/panel/login.html';
  }

  // Si el flag debe_cambiar_clave está en sessionStorage, mostrar el aviso obligatorio
  if (sessionStorage.getItem('panel_debe_cambiar_clave') === 'true') {
    document.getElementById('aviso-obligatorio').style.display = 'block';
  }

  const form    = document.getElementById('form-cambio');
  const errorEl = document.getElementById('error');
  const btn     = document.getElementById('btn-submit');

  function mostrarError(msg) {
    errorEl.textContent = msg;
    errorEl.style.display = 'block';
  }

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    errorEl.style.display = 'none';

    const claveNueva     = document.getElementById('clave-nueva').value;
    const claveConfirmar = document.getElementById('clave-confirmar').value;

    if (claveNueva.length < 6) {
      mostrarError('La contraseña debe tener al menos 6 caracteres.'); return;
    }
    if (claveNueva !== claveConfirmar) {
      mostrarError('Las contraseñas no coinciden.'); return;
    }

    btn.disabled    = true;
    btn.textContent = 'Guardando...';

    try {
      const res = await fetch('/panel/auth/cambiar-clave', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': `Bearer ${token}`,
        },
        body: JSON.stringify({ clave_nueva: claveNueva }),
      });
      const data = await res.json();

      if (!res.ok) {
        mostrarError(data.error || 'No se pudo cambiar la contraseña.');
        btn.disabled    = false;
        btn.textContent = 'Guardar contraseña';
        return;
      }

      // Limpiar el flag de cambio obligatorio y redirigir a la agenda
      sessionStorage.removeItem('panel_debe_cambiar_clave');
      window.location.href = '/panel/agenda.html';

    } catch {
      mostrarError('No se pudo conectar al servidor.');
      btn.disabled    = false;
      btn.textContent = 'Guardar contraseña';
    }
  });
</script>
</body>
</html>
