<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cambiar contraseña — Panel MVLA</title>
  <link rel="icon" type="image/png" href="/assets/escudo_vla_web.png">
  <link rel="stylesheet" href="/assets/design-tokens.css">
  <style>
    /* ── Body: layout centrado (fondo y fuente vienen de design-tokens.css) ── */
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }

    /* ── Card ────────────────────────────────────────────────────── */
    .card {
      background: var(--bg-3);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 2.5rem;
      width: 100%;
      max-width: 420px;
    }

    /* ── Encabezado ──────────────────────────────────────────────── */
    .encabezado {
      text-align: center;
      margin-bottom: 1.75rem;
      padding-bottom: 1.5rem;
      border-bottom: 1px solid var(--border);
    }
    .encabezado img {
      max-width: 80px;
      height: auto;
      display: block;
      margin: 0 auto 1rem;
    }
    .encabezado h1 {
      font-size: var(--text-lg);
      font-weight: 700;
      color: var(--teal);
    }

    /* ── Aviso de contraseña temporal ────────────────────────────── */
    .aviso {
      background: var(--amber-dim);
      border: 1px solid var(--amber-mid);
      color: var(--amber);
      padding: 0.75rem 1rem;
      border-radius: var(--radius-md);
      font-size: var(--text-sm);
      margin-bottom: 1.25rem;
    }

    /* ── Formulario ──────────────────────────────────────────────── */
    .form-grupo { margin-bottom: 1.1rem; }
    label {
      display: block;
      font-size: var(--text-sm);
      font-weight: 500;
      color: var(--text-2);
      margin-bottom: 0.4rem;
    }
    input {
      width: 100%;
      padding: 0.6rem 0.8rem;
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      font-size: var(--text-sm);
      background: var(--bg-4);
      color: var(--text-1);
      transition: var(--transition-fast);
    }
    input::placeholder { color: var(--text-3); }
    input:focus {
      border-color: var(--border-hi);
      box-shadow: 0 0 0 3px var(--teal-dim);
    }

    /* ── Alerta de error (JS usa style.display, no clase) ─────────── */
    .error {
      background: var(--red-dim);
      border: 1px solid var(--red-mid);
      color: var(--red);
      padding: 0.7rem 0.9rem;
      border-radius: var(--radius-md);
      font-size: var(--text-sm);
      margin-bottom: 1rem;
      display: none;
    }

    /* ── Botón ancho completo + estado disabled ───────────────────── */
    .btn-full { width: 100%; justify-content: center; }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }

    /* ── Pie de página ───────────────────────────────────────────── */
    .pie {
      text-align: center;
      margin-top: 1.25rem;
      font-size: var(--text-xs);
      color: var(--text-3);
    }
  </style>
</head>
<body>

<div class="card">
  <div class="encabezado">
    <img src="/assets/escudo_vla_web_color.png"
         alt="Municipalidad de Villa La Angostura">
    <h1>Cambiar contraseña</h1>
  </div>

  <!-- Aviso visible solo cuando el cambio es obligatorio (primer login con clave temporal) -->
  <div class="aviso" id="aviso-obligatorio" style="display:none">
    Tu cuenta tiene una contraseña temporal. Debés establecer una nueva contraseña
    antes de continuar.
  </div>

  <form id="form-cambio">
    <div class="form-grupo">
      <label for="clave-nueva">Nueva contraseña</label>
      <input type="password" id="clave-nueva" autocomplete="new-password"
             placeholder="Mínimo 6 caracteres" required>
    </div>
    <div class="form-grupo">
      <label for="clave-confirmar">Confirmar contraseña</label>
      <input type="password" id="clave-confirmar" autocomplete="new-password"
             placeholder="Repetí la nueva contraseña" required>
    </div>

    <div class="error" id="error"></div>

    <button type="submit" class="btn btn-primary btn-full" id="btn-submit">
      Guardar contraseña
    </button>
  </form>

  <p class="pie">Municipalidad de Villa La Angostura — Sistema de Turnos</p>
</div>

<script>
  // Verificar que haya sesión activa (token generado en el login)
  const token = sessionStorage.getItem('panel_token');
  if (!token) {
    window.location.href = '/panel/login.html';
  }

  // Si el flag debe_cambiar_clave está en sessionStorage, mostrar el aviso obligatorio
  if (sessionStorage.getItem('panel_debe_cambiar_clave') === 'true') {
    document.getElementById('aviso-obligatorio').style.display = 'block';
  }

  const form    = document.getElementById('form-cambio');
  const errorEl = document.getElementById('error');
  const btn     = document.getElementById('btn-submit');

  function mostrarError(msg) {
    errorEl.textContent = msg;
    errorEl.style.display = 'block';
  }

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    errorEl.style.display = 'none';

    const claveNueva     = document.getElementById('clave-nueva').value;
    const claveConfirmar = document.getElementById('clave-confirmar').value;

    if (claveNueva.length < 6) {
      mostrarError('La contraseña debe tener al menos 6 caracteres.'); return;
    }
    if (claveNueva !== claveConfirmar) {
      mostrarError('Las contraseñas no coinciden.'); return;
    }

    btn.disabled    = true;
    btn.textContent = 'Guardando...';

    try {
      const res = await fetch('/panel/auth/cambiar-clave', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': `Bearer ${token}`,
        },
        body: JSON.stringify({ clave_nueva: claveNueva }),
      });
      const data = await res.json();

      if (!res.ok) {
        mostrarError(data.error || 'No se pudo cambiar la contraseña.');
        btn.disabled    = false;
        btn.textContent = 'Guardar contraseña';
        return;
      }

      // Limpiar el flag de cambio obligatorio y redirigir a la agenda
      sessionStorage.removeItem('panel_debe_cambiar_clave');
      window.location.href = '/panel/agenda.html';

    } catch {
      mostrarError('No se pudo conectar al servidor.');
      btn.disabled    = false;
      btn.textContent = 'Guardar contraseña';
    }
  });
</script>
</body>
</html>
