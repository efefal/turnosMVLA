<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel — Iniciar sesión</title>
  <link rel="icon" type="image/png" href="/assets/escudo_vla_web.png">
  <script>
    (function() {
      if (localStorage.getItem('panel_tema') === 'light') {
        document.documentElement.setAttribute('data-theme', 'light');
      }
    })();
  </script>
  <link rel="stylesheet" href="/assets/design-tokens.css">
  <style>
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }

    .card {
      background: var(--bg-3);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      box-shadow: 0 24px 64px rgba(0, 0, 0, 0.5);
      padding: 2.5rem 2rem;
      width: 100%;
      max-width: 400px;
    }

    .encabezado {
      text-align: center;
      margin-bottom: 2rem;
      padding-bottom: 1.5rem;
      border-bottom: 1px solid var(--border);
    }

    .encabezado img {
      max-width: 72px;
      height: auto;
      display: block;
      margin: 0 auto 1rem;
    }

    .encabezado h1 {
      font-size: var(--text-xs);
      font-weight: 700;
      color: var(--text-2);
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    .encabezado p {
      margin-top: 0.3rem;
      font-size: var(--text-xs);
      color: var(--text-3);
      letter-spacing: 0.05em;
    }

    .form-grupo {
      margin-bottom: 1rem;
    }

    label {
      display: block;
      font-size: var(--text-sm);
      font-weight: 500;
      color: var(--text-2);
      margin-bottom: 0.4rem;
    }

    input[type="email"],
    input[type="password"] {
      width: 100%;
      background: var(--bg-4);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      color: var(--text-1);
      font-size: var(--text-base);
      padding: 0.55rem 0.75rem;
      transition: var(--transition-fast);
    }

    input[type="email"]::placeholder,
    input[type="password"]::placeholder {
      color: var(--text-3);
    }

    input[type="email"]:focus,
    input[type="password"]:focus {
      border-color: var(--border-hi);
      box-shadow: 0 0 0 3px var(--teal-dim);
    }

    .error {
      background: var(--red-dim);
      border: 1px solid var(--red-mid);
      color: var(--red);
      padding: 0.6rem 0.75rem;
      border-radius: var(--radius-md);
      font-size: var(--text-sm);
      margin-bottom: 1rem;
      display: none;
    }

    .btn-ingresar {
      width: 100%;
      padding: 0.6rem;
      background: var(--teal);
      color: var(--bg-0);
      border: none;
      border-radius: var(--radius-md);
      font-size: var(--text-md);
      font-weight: 700;
      cursor: pointer;
      transition: background 0.15s;
    }

    .btn-ingresar:hover:not(:disabled) {
      opacity: 0.88;
    }

    .btn-ingresar:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    .pie {
      text-align: center;
      margin-top: 1.5rem;
      font-size: var(--text-xs);
      color: var(--text-3);
    }

    .btn-tema-toggle {
      background: transparent;
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      color: var(--text-2);
      padding: 5px 10px;
      font-family: var(--font-ui);
      font-size: var(--text-sm);
      cursor: pointer;
      width: 100%;
      margin-top: 0.75rem;
      transition: var(--transition-fast);
    }
    .btn-tema-toggle:hover {
      background: var(--bg-4);
      border-color: var(--border-hi);
      color: var(--text-1);
    }
  </style>
</head>
<body>

<div class="card">
  <div class="encabezado">
    <img src="/assets/escudo_vla_web_color.png"
         alt="Municipalidad de Villa La Angostura">
    <h1>Municipalidad de Villa La Angostura</h1>
    <p>Sistema de turnos — Panel de empleados</p>
  </div>

  <form id="form-login">
    <div class="form-grupo">
      <label for="email">Correo electrónico</label>
      <input type="email" id="email" autocomplete="email"
             placeholder="nombre@municipio.gob.ar" required>
    </div>
    <div class="form-grupo">
      <label for="password">Contraseña</label>
      <input type="password" id="password" autocomplete="current-password"
             placeholder="••••••••" required>
    </div>

    <div class="error" id="error"></div>

    <button type="submit" class="btn-ingresar" id="btn-submit">
      Iniciar sesión
    </button>
  </form>

  <p class="pie">La sesión se cerrará al cerrar el navegador.</p>
  <button class="btn-tema-toggle" id="btn-tema" onclick="toggleTema()"><span id="texto-tema">Modo claro</span></button>
</div>

<script>
  // ─── Tema claro/oscuro ─────────────────────────────────────────────────────
  // Persiste en localStorage (panel_tema) — a diferencia del JWT, es una
  // preferencia de usuario, no un dato de sesión, así que sobrevive al cierre
  // del navegador. El botón siempre describe la acción (a qué modo cambia al
  // hacer clic), no el estado actual.
  function actualizarTextoTema() {
    const claro = document.documentElement.getAttribute('data-theme') === 'light';
    const texto = document.getElementById('texto-tema');
    if (texto) texto.textContent = claro ? 'Modo oscuro' : 'Modo claro';
  }
  function toggleTema() {
    const claro = document.documentElement.getAttribute('data-theme') === 'light';
    if (claro) {
      document.documentElement.removeAttribute('data-theme');
      localStorage.setItem('panel_tema', 'dark');
    } else {
      document.documentElement.setAttribute('data-theme', 'light');
      localStorage.setItem('panel_tema', 'light');
    }
    actualizarTextoTema();
  }
  actualizarTextoTema();

  // Si ya hay sesión activa, ir directo a la agenda
  if (sessionStorage.getItem('panel_token')) {
    window.location.href = '/panel/agenda.html';
  }

  const form    = document.getElementById('form-login');
  const errorEl = document.getElementById('error');
  const btn     = document.getElementById('btn-submit');

  function mostrarError(msg) {
    errorEl.textContent = msg;
    errorEl.style.display = 'block';
  }

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    errorEl.style.display = 'none';
    btn.disabled    = true;
    btn.textContent = 'Ingresando...';

    const email    = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;

    try {
      const res  = await fetch('/panel/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, password }),
      });
      const data = await res.json();

      if (!res.ok) {
        mostrarError(data.error || 'No se pudo iniciar sesión.');
        btn.disabled    = false;
        btn.textContent = 'Iniciar sesión';
        return;
      }

      // sessionStorage se borra automáticamente al cerrar el navegador
      sessionStorage.setItem('panel_token',   data.token);
      sessionStorage.setItem('panel_usuario', JSON.stringify(data.usuario));

      // Si el servidor indica que la clave es temporal, redirigir a cambiar-clave.html.
      // El token fue generado igualmente, pero el usuario solo puede hacer esa acción.
      if (data.debe_cambiar_clave) {
        sessionStorage.setItem('panel_debe_cambiar_clave', 'true');
        window.location.href = '/panel/cambiar-clave.html';
        return;
      }

      window.location.href = '/panel/agenda.html';

    } catch {
      mostrarError('No se pudo conectar al servidor. Verificá que el sistema esté en funcionamiento.');
      btn.disabled    = false;
      btn.textContent = 'Iniciar sesión';
    }
  });
</script>
</body>
</html>
