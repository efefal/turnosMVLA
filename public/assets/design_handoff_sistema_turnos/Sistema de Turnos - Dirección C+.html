<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistema de Turnos · Dirección C+ — Enriquecido</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
    html,body,#root{width:100%;height:100%;}
    body{background:#060d18;}
    ::-webkit-scrollbar{width:5px;height:5px;}
    ::-webkit-scrollbar-track{background:transparent;}
    ::-webkit-scrollbar-thumb{background:rgba(45,212,160,0.18);border-radius:3px;}
    select,input{outline:none;cursor:pointer;}
  </style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" src="c-plus-shared.jsx"></script>
<script type="text/babel">

const {P,SH,HRS,tRow,DAYS_DATA,APPT_C,DAY_BG,DAY_HDR,dayColor,
  USERS_DATA,SERVICES_DATA,AUDIT_DATA,A_COLOR,A_LABEL,ROLE_COLOR,
  NavIcon,MiniCalendar,Sidebar,DonutChart,BarChartSVG,SparkLine,HeatmapCalendar} = window;

/* ══════════════════════════════════════════════════════
   SCREEN 1 — AGENDA SEMANA+
   · Búsqueda global central  · Bloqueados con overlay
   · Cards: badge + operador  · Today: zona + turno
══════════════════════════════════════════════════════ */
function AgendaSemana(){
  return(
    <div style={{width:'100%',height:'100%',display:'flex',fontFamily:P.font,overflow:'hidden',background:P.bg2,color:P.t1}}>
      <Sidebar active="Agenda"/>
      <div style={{flex:1,display:'flex',flexDirection:'column',overflow:'hidden'}}>

        {/* ── TOPBAR 3 columnas ── */}
        <div style={{height:54,padding:'0 16px',borderBottom:`1px solid ${P.bdr}`,display:'flex',alignItems:'center',gap:8,flexShrink:0,background:'rgba(0,0,0,0.18)'}}>
          <div style={{display:'flex',alignItems:'center',gap:6,flexShrink:0}}>
            <span style={{fontSize:15,fontWeight:700,color:P.t1}}>Agenda</span>
            <div style={{display:'flex',gap:1,padding:'2px',background:P.bg1,borderRadius:6,border:`1px solid ${P.bdr}`}}>
              {['Día','Semana','Mes'].map(v=>(
                <div key={v} style={{padding:'3px 10px',borderRadius:4,background:v==='Semana'?P.bg4:'transparent',color:v==='Semana'?P.t1:P.t3,fontSize:11.5,cursor:'pointer',fontWeight:v==='Semana'?600:400}}>{v}</div>
              ))}
            </div>
            <div style={{display:'flex',gap:2}}>
              {['◀','▶'].map(a=>(<div key={a} style={{width:24,height:24,borderRadius:4,border:`1px solid ${P.bdr}`,display:'flex',alignItems:'center',justifyContent:'center',color:P.t2,fontSize:11,cursor:'pointer'}}>{a}</div>))}
            </div>
            <span style={{fontSize:11.5,fontWeight:600,color:P.t1,fontFamily:P.mono,whiteSpace:'nowrap'}}>15–21 Jun 2026</span>
          </div>

          {/* BÚSQUEDA GLOBAL */}
          <div style={{flex:1,display:'flex',justifyContent:'center'}}>
            <div style={{display:'flex',alignItems:'center',gap:9,background:P.bg3,border:`1px solid ${P.bdrHi}`,borderRadius:7,padding:'7px 14px',width:340,cursor:'text'}}>
              <svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke={P.t3} strokeWidth="1.8" strokeLinecap="round"><circle cx="6.5" cy="6.5" r="4.5"/><path d="M11 11l3.5 3.5"/></svg>
              <span style={{fontSize:12.5,color:P.t3,flex:1}}>Buscar vecino, DNI, n.º turno…</span>
              <div style={{padding:'1px 7px',borderRadius:4,border:`1px solid ${P.bdr}`,fontSize:10,color:P.t3,fontFamily:P.mono}}>⌘K</div>
            </div>
          </div>

          <div style={{display:'flex',alignItems:'center',gap:5,flexShrink:0}}>
            {[{n:'13',l:'Total',c:P.t2,bg:'rgba(200,220,240,0.07)'},{n:'9',l:'Agendados',c:P.blue,bg:P.blueDim},{n:'3',l:'Presentes',c:P.teal,bg:P.tealDim},{n:'1',l:'Ausentes',c:P.red,bg:P.redDim}].map(s=>(
              <div key={s.l} style={{display:'flex',flexDirection:'column',alignItems:'center',padding:'2px 8px',borderRadius:5,background:s.bg,minWidth:46}}>
                <span style={{fontSize:15,fontWeight:800,color:s.c,lineHeight:1.1,fontFamily:P.mono}}>{s.n}</span>
                <span style={{fontSize:8,color:s.c,opacity:.8,fontWeight:600}}>{s.l}</span>
              </div>
            ))}
            <div style={{marginLeft:4,padding:'6px 14px',borderRadius:5,background:P.teal,color:P.bg0,fontSize:12,fontWeight:700,cursor:'pointer',flexShrink:0}}>+ Nueva Reserva</div>
          </div>
        </div>

        {/* Area filter */}
        <div style={{height:36,padding:'0 16px',borderBottom:`1px solid ${P.bdr}`,display:'flex',alignItems:'center',gap:8,flexShrink:0}}>
          <span style={{fontSize:9,color:P.t3,textTransform:'uppercase',letterSpacing:'0.1em',fontWeight:700,flexShrink:0}}>Área</span>
          {['Todas','Licencias de Conducir','Tribunal de Faltas'].map((a,i)=>(
            <div key={a} style={{padding:'2px 11px',borderRadius:20,border:`1px solid ${i===0?P.tealMid:P.bdr}`,background:i===0?P.tealDim:'transparent',color:i===0?P.teal:P.t3,fontSize:11.5,cursor:'pointer',fontWeight:i===0?700:400}}>{a}</div>
          ))}
          <div style={{marginLeft:'auto',padding:'4px 10px',borderRadius:5,border:`1px solid ${P.bdr}`,fontSize:11.5,color:P.t2,cursor:'pointer'}}>Todos los operadores ▾</div>
        </div>

        {/* CALENDARIO */}
        <div style={{flex:1,margin:'8px 16px 10px',border:`1px solid ${P.bdr}`,borderRadius:7,overflow:'hidden',display:'flex',flexDirection:'column',background:P.bg3}}>
          <div style={{display:'flex',borderBottom:`1px solid ${P.bdr}`,flexShrink:0}}>
            <div style={{width:46,flexShrink:0,borderRight:`1px solid ${P.bdr}`}}/>
            {DAYS_DATA.map(day=>{
              const dc=dayColor(day.status);
              return(
                <div key={day.d} style={{flex:1,padding:'5px 4px 4px',textAlign:'center',background:DAY_HDR[day.status]||'transparent',borderLeft:`1px solid ${P.bdr}`}}>
                  <div style={{fontSize:9,color:dc,fontWeight:700,textTransform:'uppercase',letterSpacing:'0.08em'}}>{day.d}</div>
                  <div style={{fontSize:20,fontWeight:800,color:dc,lineHeight:1.05,fontFamily:P.mono}}>{day.dt}</div>
                  {day.status==='blocked'
                    ? <div style={{marginTop:2}}>
                        <div style={{display:'inline-block',padding:'1px 5px',borderRadius:3,background:'rgba(75,168,248,0.16)',border:`1px solid rgba(75,168,248,0.28)`,fontSize:7.5,color:P.blue,fontWeight:800,letterSpacing:'0.1em',textTransform:'uppercase',marginBottom:2}}>BLOQUEADO</div>
                        <div style={{fontSize:8.5,color:P.blue,opacity:.75,fontWeight:600,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap',paddingLeft:2,paddingRight:2}}>{day.blockUser}</div>
                        <div style={{fontSize:8,color:P.t3,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap',paddingLeft:2,paddingRight:2}}>{day.blockReason}</div>
                        {day.count>0&&<div style={{fontSize:7.5,color:P.t3,marginTop:1,opacity:.6}}>{day.count} agendados</div>}
                      </div>
                    : <>
                        {day.lbl&&<div style={{fontSize:8.5,color:dc,opacity:.7,fontWeight:600}}>{day.lbl}</div>}
                        {day.count>0&&<div style={{fontSize:8,color:dc,opacity:.55}}>{day.count} turnos</div>}
                      </>
                  }
                </div>
              );
            })}
          </div>

          <div style={{flex:1,display:'flex',overflow:'hidden'}}>
            <div style={{width:46,flexShrink:0,borderRight:`1px solid ${P.bdr}`}}>
              {HRS.map(h=>(<div key={h} style={{height:SH,display:'flex',alignItems:'flex-start',justifyContent:'flex-end',paddingRight:6,paddingTop:3,fontSize:9,color:P.t3,fontFamily:P.mono}}>{h.endsWith(':00')?h:''}</div>))}
            </div>
            {DAYS_DATA.map(day=>(
              <div key={day.d} style={{flex:1,position:'relative',borderLeft:`1px solid ${P.bdr}`,background:DAY_BG[day.status]||'transparent'}}>
                {HRS.map((h,i)=>(<div key={h} style={{position:'absolute',top:i*SH,left:0,right:0,height:1,background:h.endsWith(':00')?P.bdr:'rgba(30,52,80,0.32)'}}/>))}

                {/* BLOQUEADO: rayas + marca de agua */}
                {day.status==='blocked'&&<>
                  <div style={{position:'absolute',inset:0,backgroundImage:'repeating-linear-gradient(-45deg,transparent,transparent 10px,rgba(75,168,248,0.055) 10px,rgba(75,168,248,0.055) 20px)',pointerEvents:'none',zIndex:0}}/>
                  <div style={{position:'absolute',inset:0,display:'flex',alignItems:'center',justifyContent:'center',pointerEvents:'none',overflow:'hidden',zIndex:0}}>
                    <span style={{fontSize:14,fontWeight:800,color:'rgba(75,168,248,0.11)',letterSpacing:'0.28em',textTransform:'uppercase',transform:'rotate(-45deg)',fontFamily:P.font,userSelect:'none',whiteSpace:'nowrap'}}>BLOQUEADO</span>
                  </div>
                </>}

                {(day.status==='holiday'||day.status==='closed')&&(
                  <div style={{position:'absolute',inset:0,backgroundImage:'repeating-linear-gradient(-45deg,transparent,transparent 8px,rgba(245,104,104,0.04) 8px,rgba(245,104,104,0.04) 16px)',pointerEvents:'none'}}/>
                )}

                {/* CARDS: badge + operador */}
                {day.appts.map(a=>{
                  const c=APPT_C[a.c];
                  return(
                    <div key={a.t+a.n} style={{position:'absolute',top:tRow(a.t)*SH+2,left:3,right:3,height:SH-4,background:c.bg,borderLeft:`3px solid ${c.dot}`,borderRadius:5,padding:'3px 5px',display:'flex',flexDirection:'column',justifyContent:'center',overflow:'hidden',cursor:'pointer',boxShadow:`inset 0 0 0 1px ${c.ring}`,zIndex:1}}>
                      <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:1}}>
                        <span style={{fontSize:9.5,fontWeight:500,color:c.tx,fontFamily:P.mono}}>{a.t}</span>
                        <div style={{width:17,height:17,borderRadius:9,background:`${c.dot}22`,display:'flex',alignItems:'center',justifyContent:'center',fontSize:7.5,fontWeight:700,color:c.tx,flexShrink:0}}>{a.op}</div>
                      </div>
                      <div style={{fontSize:11,fontWeight:700,color:P.t1,lineHeight:1.2,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{a.n}</div>
                      <div style={{marginTop:2,padding:'1px 5px',borderRadius:3,background:`${c.dot}18`,fontSize:8.5,color:c.tx,fontWeight:600,width:'fit-content'}}>{a.svcS}</div>
                    </div>
                  );
                })}

                {/* TODAY: zona agregar */}
                {day.status==='today'&&(
                  <div style={{position:'absolute',bottom:8,left:4,right:4,height:30,borderRadius:5,border:`1px dashed ${P.tealMid}`,display:'flex',alignItems:'center',justifyContent:'center',gap:5,cursor:'pointer',color:P.teal,zIndex:1}}>
                    <span style={{fontSize:16,lineHeight:1}}>+</span>
                    <span style={{fontSize:10.5,fontWeight:600}}>Agregar turno</span>
                  </div>
                )}
              </div>
            ))}
          </div>
        </div>
      </div>
    </div>
  );
}

/* ══════════════════════════════════════════════════════
   SCREEN 2 — PRESENCIAL · DRAWER
   · Agenda de fondo (atenuada) · Drawer paso 2
   · Selección de fecha + horario disponible
══════════════════════════════════════════════════════ */
function PresencialDrawer(){
  const slots=['08:30','09:00','09:30','10:00','10:30','11:00','11:30','12:00','12:30','13:00','13:30','14:00'];
  const taken=['09:00','10:30','12:00'];
  const sel='11:00';
  return(
    <div style={{width:'100%',height:'100%',display:'flex',fontFamily:P.font,overflow:'hidden',background:P.bg2,color:P.t1}}>
      <Sidebar active="Presencial"/>

      {/* FONDO: calendario fantasma */}
      <div style={{flex:1,position:'relative',overflow:'hidden'}}>
        <div style={{position:'absolute',top:0,left:0,right:0,height:54,borderBottom:`1px solid rgba(30,52,80,0.3)`,display:'flex',alignItems:'center',paddingLeft:14,gap:8,opacity:0.14}}>
          <span style={{fontSize:14,fontWeight:700,color:P.t1}}>Agenda</span>
          <span style={{fontSize:11,color:P.t2,fontFamily:P.mono}}>15–21 Jun 2026</span>
        </div>
        <div style={{position:'absolute',top:90,left:0,right:0,bottom:0,display:'flex',opacity:0.13}}>
          <div style={{width:46,borderRight:`1px solid ${P.bdr}`}}/>
          {DAYS_DATA.map(d=>(
            <div key={d.d} style={{flex:1,borderLeft:`1px solid ${P.bdr}`}}>
              <div style={{padding:'5px 0',textAlign:'center',borderBottom:`1px solid ${P.bdr}`,background:DAY_HDR[d.status]||'transparent'}}>
                <div style={{fontSize:8,color:dayColor(d.status),fontWeight:700}}>{d.d}</div>
                <div style={{fontSize:16,fontWeight:800,color:dayColor(d.status),fontFamily:P.mono}}>{d.dt}</div>
              </div>
            </div>
          ))}
        </div>
        {HRS.map((h,i)=><div key={h} style={{position:'absolute',top:136+i*SH,left:0,right:0,height:1,background:P.bdr,opacity:h.endsWith(':00')?0.13:0.06}}/>)}
        <div style={{position:'absolute',inset:0,background:'rgba(6,13,24,0.78)'}}/>
      </div>

      {/* DRAWER */}
      <div style={{width:560,borderLeft:`1px solid ${P.bdr}`,background:P.bg1,display:'flex',flexDirection:'column',flexShrink:0}}>
        <div style={{padding:'16px 20px',borderBottom:`1px solid ${P.bdr}`,display:'flex',alignItems:'center',justifyContent:'space-between'}}>
          <div>
            <div style={{fontSize:9,color:P.teal,textTransform:'uppercase',letterSpacing:'0.13em',fontWeight:700,marginBottom:3}}>Nueva Reserva</div>
            <div style={{fontSize:18,fontWeight:800,color:P.t1}}>Presencial</div>
          </div>
          <div style={{width:28,height:28,borderRadius:14,border:`1px solid ${P.bdr}`,display:'flex',alignItems:'center',justifyContent:'center',color:P.t2,fontSize:17,cursor:'pointer',lineHeight:1}}>×</div>
        </div>

        {/* Steps */}
        <div style={{padding:'12px 20px',borderBottom:`1px solid ${P.bdr}`,display:'flex',alignItems:'center'}}>
          {[{n:1,l:'Vecino',done:true},{n:2,l:'Turno',act:true},{n:3,l:'Confirmar'}].map((st,i)=>(
            <React.Fragment key={st.n}>
              <div style={{display:'flex',alignItems:'center',gap:7}}>
                <div style={{width:24,height:24,borderRadius:12,background:st.done?P.teal:st.act?P.blueDim:P.bdr,border:`1px solid ${st.done?P.teal:st.act?P.blue:P.bdr}`,display:'flex',alignItems:'center',justifyContent:'center',color:st.done?P.bg0:st.act?P.blue:P.t3,fontSize:11,fontWeight:700,flexShrink:0}}>
                  {st.done?'✓':st.n}
                </div>
                <span style={{fontSize:12.5,fontWeight:st.act?700:400,color:st.act?P.t1:st.done?P.teal:P.t3}}>{st.l}</span>
              </div>
              {i<2&&<div style={{flex:1,height:1,background:P.bdr,margin:'0 10px'}}/>}
            </React.Fragment>
          ))}
        </div>

        {/* Vecino confirmado */}
        <div style={{padding:'14px 20px',borderBottom:`1px solid ${P.bdr}`}}>
          <div style={{fontSize:9,color:P.t3,textTransform:'uppercase',letterSpacing:'0.1em',fontWeight:700,marginBottom:8}}>Vecino</div>
          <div style={{display:'flex',alignItems:'center',gap:10,padding:'10px 12px',background:P.tealDim,border:`1px solid ${P.tealMid}`,borderRadius:7}}>
            <div style={{width:34,height:34,borderRadius:17,background:'rgba(45,212,160,0.18)',display:'flex',alignItems:'center',justifyContent:'center',color:P.teal,fontSize:14,fontWeight:700,flexShrink:0}}>R</div>
            <div style={{flex:1}}>
              <div style={{fontSize:14,fontWeight:700,color:P.t1}}>Rosa Fuentes</div>
              <div style={{fontSize:11,color:P.t2,marginTop:1,fontFamily:P.mono}}>DNI 28.432.156 · rosa.f@email.com</div>
            </div>
            <span style={{fontSize:11,color:P.teal,fontWeight:700,flexShrink:0}}>✓ Confirmado</span>
          </div>
        </div>

        {/* Turno */}
        <div style={{flex:1,padding:'14px 20px',overflowY:'auto',display:'flex',flexDirection:'column',gap:14}}>
          <div>
            <div style={{fontSize:9,color:P.t3,textTransform:'uppercase',letterSpacing:'0.1em',fontWeight:700,marginBottom:8}}>Servicio</div>
            <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',padding:'10px 14px',background:P.bg3,border:`1px solid ${P.blue}`,borderRadius:7,cursor:'pointer'}}>
              <div>
                <div style={{fontSize:13,fontWeight:600,color:P.t1}}>Licencia de Conducir 1ra vez</div>
                <div style={{fontSize:11,color:P.t2,marginTop:1}}>30 min · Área Licencias</div>
              </div>
              <span style={{color:P.t3,fontSize:14}}>▾</span>
            </div>
          </div>

          <div>
            <div style={{fontSize:9,color:P.t3,textTransform:'uppercase',letterSpacing:'0.1em',fontWeight:700,marginBottom:8}}>Fecha</div>
            <div style={{display:'flex',gap:6}}>
              {[{d:'JUE',dt:'18',ok:false},{d:'VIE',dt:'19',ok:true,act:true},{d:'LUN',dt:'22',ok:true},{d:'MAR',dt:'23',ok:true}].map(({d,dt,ok,act})=>(
                <div key={dt} style={{flex:1,padding:'8px 4px',textAlign:'center',borderRadius:7,border:`1px solid ${act?P.blue:P.bdr}`,background:act?P.blueDim:'transparent',cursor:ok?'pointer':'default',opacity:ok?1:0.3}}>
                  <div style={{fontSize:9,color:act?P.blue:P.t3,fontWeight:700,textTransform:'uppercase'}}>{d}</div>
                  <div style={{fontSize:20,fontWeight:800,color:act?P.blue:P.t1,fontFamily:P.mono,lineHeight:1.1}}>{dt}</div>
                  <div style={{fontSize:9,color:act?P.blue:P.t3,marginTop:1}}>{dt==='19'?'Hoy':'Jun'}</div>
                </div>
              ))}
            </div>
          </div>

          <div>
            <div style={{fontSize:9,color:P.t3,textTransform:'uppercase',letterSpacing:'0.1em',fontWeight:700,marginBottom:8}}>Horarios disponibles · Vie 19 Jun</div>
            <div style={{display:'grid',gridTemplateColumns:'repeat(4,1fr)',gap:6}}>
              {slots.map(t=>{
                const isTaken=taken.includes(t), isSel=t===sel;
                return(
                  <div key={t} style={{padding:'9px 4px',textAlign:'center',borderRadius:6,border:`1px solid ${isSel?P.teal:isTaken?P.bdr:P.bdrHi}`,background:isSel?P.tealDim:isTaken?'rgba(0,0,0,0.15)':'transparent',cursor:isTaken?'not-allowed':'pointer',opacity:isTaken?0.3:1}}>
                    <div style={{fontSize:13.5,fontWeight:isSel?700:500,color:isSel?P.teal:isTaken?P.t3:P.t1,fontFamily:P.mono}}>{t}</div>
                  </div>
                );
              })}
            </div>
          </div>
        </div>

        <div style={{padding:'12px 20px',borderTop:`1px solid ${P.bdr}`,display:'flex',gap:8}}>
          <div style={{flex:1,padding:'10px',borderRadius:6,border:`1px solid ${P.bdr}`,textAlign:'center',fontSize:13,color:P.t2,cursor:'pointer',fontWeight:500}}>Cancelar</div>
          <div style={{flex:2,padding:'10px',borderRadius:6,background:P.teal,textAlign:'center',fontSize:13,color:P.bg0,cursor:'pointer',fontWeight:700}}>Confirmar Turno →</div>
        </div>
      </div>
    </div>
  );
}

/* ══════════════════════════════════════════════════════
   SCREEN 3 — DASHBOARD ANALÍTICAS+
   · KPIs grandes (DM Mono 38px)  · Heatmap 22 semanas
══════════════════════════════════════════════════════ */
function DashAnaliticas(){
  const kpis=[
    {l:'Total semana',    v:'13',     delta:'+8%',    up:true, color:P.t1,   spark:[7,10,9,13,11,13]},
    {l:'Tasa asistencia', v:'84%',    delta:'+3%',    up:true, color:P.teal, spark:[72,78,80,81,82,84]},
    {l:'Pendientes hoy',  v:'2',      delta:'−1',     up:true, color:P.amber,spark:[5,4,3,2,3,2]},
    {l:'Prom. espera',    v:'18 min', delta:'−2 min', up:true, color:P.blue, spark:[24,22,21,20,19,18]},
  ];
  const donut=[{v:7,color:P.blue,l:'Agendados'},{v:3,color:P.teal,l:'Presentes'},{v:2,color:'#4fd4b2',l:'Atendidos'},{v:1,color:P.red,l:'Ausentes'}];
  const bars=[{l:'LUN',v:2,hi:false},{l:'MAR',v:3,hi:false},{l:'MIÉ',v:3,hi:false},{l:'JUE',v:3,hi:false},{l:'VIE',v:2,hi:true}];
  const months=[{l:'Ene',v:42},{l:'Feb',v:38},{l:'Mar',v:51},{l:'Abr',v:48},{l:'May',v:55},{l:'Jun',v:32}];
  const mMax=55,mMin=32,mPH=78,mW=380;
